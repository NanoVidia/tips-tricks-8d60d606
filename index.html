  <head>

    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- iOS standalone / fullscreen home-screen mode -->

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tips &amp; Tricks Daily Quiz" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Android / Windows tile -->
    <meta name="application-name" content="Tips &amp; Tricks Daily Quiz" />
    <meta name="msapplication-TileColor" content="#f5f3ee" />
    <meta name="msapplication-tap-highlight" content="no" />

    <title>Tips &amp; Tricks Daily Quiz – Fun Knowledge & Inspiration</title>
    <meta name="description" content="A daily dose of fun trivia, inspiring quotes, vocabulary and lifestyle tips. Educational entertainment only." />
    <meta name="keywords" content="tips, tricks, daily quiz, trivia, inspiration, affirmations, vocabulary, general knowledge, lifestyle, learning" />
    <link rel="canonical" href="https://tips-tricks.lovable.app/" />

    <!-- Preconnect to backend + fonts to parallelize handshakes -->
    <link rel="preconnect" href="https://hebhetjvcauitozkxggt.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Editorial typography: non-blocking swap so first paint isn't held on Google Fonts -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" />
    </noscript>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tips-tricks.lovable.app/" />
    <meta property="og:title" content="Tips &amp; Tricks Daily Quiz – Fun Knowledge & Inspiration" />
    <meta property="og:description" content="Daily trivia, inspiring quotes, and lifestyle tips. Educational entertainment only." />
    <meta property="og:site_name" content="Tips &amp; Tricks Daily Quiz" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tips &amp; Tricks Daily Quiz – Fun Knowledge & Inspiration" />
    <meta name="twitter:description" content="Daily trivia, inspiring quotes, and lifestyle tips." />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Tips &amp; Tricks Daily Quiz",
      "description": "Daily trivia, inspiring quotes, and lifestyle tips. Educational entertainment only.",
      "url": "https://tips-tricks.lovable.app/",
      "inLanguage": ["en", "ar"]
    }
    </script>
  </head>

  <body style="background-color: #f6f9fc; margin: 0;">
    <!-- ⚡ Instant branded splash — paints before React loads, fades out on mount -->
    <style>
      #app-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #eef2ff 0%, #f6f9fc 45%, #fdf4ff 100%);
        font-family: 'Playfair Display', Georgia, serif;
        transition: opacity 280ms ease-out;
        -webkit-user-select: none; user-select: none;
      }
      #app-splash.is-hidden { opacity: 0; pointer-events: none; }
      #app-splash .splash-title {
        font-size: clamp(26px, 7vw, 44px);
        font-weight: 800;
        letter-spacing: 0.04em;
        text-align: center;
        line-height: 1.15;
        background: linear-gradient(
          100deg,
          #6366f1 0%,
          #6366f1 38%,
          #ffffff 50%,
          #6366f1 62%,
          #6366f1 100%
        );
        background-size: 250% 100%;
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation:
          splash-rise 520ms cubic-bezier(.2,.7,.2,1) both,
          splash-shine 2.8s ease-in-out 380ms infinite;
        text-shadow: 0 2px 24px rgba(99,102,241,.18);
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(14px) scale(.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes splash-shine {
        0%   { background-position: 180% 0; }
        100% { background-position: -80% 0; }
      }
      @media (prefers-color-scheme: dark) {
        #app-splash { background: linear-gradient(135deg, #0f172a 0%, #141414 50%, #1e1b4b 100%); }
      }
    </style>
    <div id="app-splash" aria-hidden="true">
      <div class="splash-title">OBGYN TIPS &amp; TRICKS</div>
    </div>
    <script>
      (function () {
        function hide() {
          var el = document.getElementById('app-splash');
          if (!el) return;
          el.classList.add('is-hidden');
          setTimeout(function () { el && el.parentNode && el.parentNode.removeChild(el); }, 320);
        }
        // Hide as soon as React paints something into #root, or after a hard cap
        var root = document.getElementById('root');
        var hidden = false;
        function safeHide() { if (hidden) return; hidden = true; hide(); }
        if (root && 'MutationObserver' in window) {
          var mo = new MutationObserver(function () {
            if (root.childElementCount > 0) { mo.disconnect(); requestAnimationFrame(safeHide); }
          });
          mo.observe(root, { childList: true });
        }
        // Hard cap so splash never lingers
        setTimeout(safeHide, 1500);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
