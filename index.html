<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />

    <!-- PWA / Installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- iOS standalone / fullscreen home-screen mode -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tips &amp; Tricks Daily Quiz" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Android / Windows tile -->
    <meta name="application-name" content="Tips &amp; Tricks Daily Quiz" />
    <meta name="msapplication-TileColor" content="#f5f3ee" />
    <meta name="msapplication-tap-highlight" content="no" />

    <title>Tips &amp; Tricks Daily Quiz – Fun Knowledge & Inspiration</title>
    <meta name="description" content="A daily dose of fun trivia, inspiring quotes, vocabulary and lifestyle tips. Educational entertainment only." />
    <meta name="keywords" content="tips, tricks, daily quiz, trivia, inspiration, affirmations, vocabulary, general knowledge, lifestyle, learning" />
    <link rel="canonical" href="https://tips-tricks.lovable.app/" />

    <!-- Preconnect to backend + fonts to parallelize handshakes -->
    <link rel="preconnect" href="https://hebhetjvcauitozkxggt.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Editorial typography: non-blocking swap so first paint isn't held on Google Fonts -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" />
    </noscript>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tips-tricks.lovable.app/" />
    <meta property="og:title" content="Tips &amp; Tricks Daily Quiz – Fun Knowledge & Inspiration" />
    <meta property="og:description" content="Daily trivia, inspiring quotes, and lifestyle tips. Educational entertainment only." />
    <meta property="og:site_name" content="Tips &amp; Tricks Daily Quiz" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tips &amp; Tricks Daily Quiz – Fun Knowledge & Inspiration" />
    <meta name="twitter:description" content="Daily trivia, inspiring quotes, and lifestyle tips." />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Tips &amp; Tricks Daily Quiz",
      "description": "Daily trivia, inspiring quotes, and lifestyle tips. Educational entertainment only.",
      "url": "https://tips-tricks.lovable.app/",
      "inLanguage": ["en", "ar"]
    }
    </script>
  </head>

  <body style="background-color: #f6f9fc; margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
