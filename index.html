<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />

    <!-- PWA / Installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- iOS standalone / fullscreen home-screen mode -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tips & Tricks" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Android / Windows tile -->
    <meta name="application-name" content="Tips & Tricks" />
    <meta name="msapplication-TileColor" content="#f5f3ee" />
    <meta name="msapplication-tap-highlight" content="no" />

    <title>Professionals Quiz — General Knowledge</title>
    <meta name="description" content="A light general-knowledge quiz app: history, language, communication and career questions. Educational entertainment only." />
    <meta name="keywords" content="quiz, trivia, general knowledge, history, language, communication, career" />
    <link rel="canonical" href="https://tips-tricks.lovable.app/" />

    <!-- Editorial typography: Playfair Display + Inter, preconnected for fast LCP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500&display=swap" rel="stylesheet" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tips-tricks.lovable.app/" />
    <meta property="og:title" content="Tips & Tricks — OB/GYN Clinical Reference" />
    <meta property="og:description" content="200+ OB/GYN scenarios, scripts, calculators & AI assistant for clinicians." />
    <meta property="og:site_name" content="Tips & Tricks" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tips & Tricks — OB/GYN Clinical Reference" />
    <meta name="twitter:description" content="200+ scenarios, scripts, calculators & AI assistant for OB/GYN practice." />

    <!-- Structured data for medical reference -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalWebPage",
      "name": "Tips & Tricks — OB/GYN Clinical Reference",
      "description": "Curated bedside OB/GYN scenarios, scripts, calculators and an AI assistant.",
      "url": "https://tips-tricks.lovable.app/",
      "audience": { "@type": "MedicalAudience", "audienceType": "Clinician" },
      "specialty": "Obstetrics and Gynecology",
      "inLanguage": ["en", "ar"]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
