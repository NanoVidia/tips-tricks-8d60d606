name: Release

# ==============================================================================
# الإصدار الرسمي — يبني AAB موقّع، يدفعه لـ Google Play (اختياري)،
# ينشئ GitHub Release مع changelog تلقائي، ويرسل إشعار Telegram (اختياري).
#
# الإطلاق:
#   • يدوي: Actions → Release → Run workflow → اختر bump (patch/minor/major)
#   • تلقائي: push tag بصيغة v1.2.3
#
# الأسرار المطلوبة:
#   ✅ ANDROID_KEYSTORE_BASE64 / _PASSWORD / _ALIAS — تُولَّد تلقائياً عند الغياب
#   ✅ ANDROID_KEY_PASSWORD
#   ⚪ GOOGLE_PLAY_SERVICE_ACCOUNT_JSON — لتفعيل الرفع التلقائي على Play
#   ⚪ TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID — لإشعار النجاح
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "نوع الترقية"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major, manual]
      version_name:
        description: "(للوضع manual فقط) رقم الإصدار العام مثل 1.5.0"
        required: false
        default: ""
      version_code:
        description: "(اختياري) versionCode محدد، اتركه فارغاً للتزايد التلقائي"
        required: false
        default: ""
      track:
        description: "مسار النشر على Google Play"
        required: true
        default: "none"
        type: choice
        options: [none, internal, alpha, beta, production]
      create_github_release:
        description: "إنشاء GitHub Release مع AAB"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build · Sign · Publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: 🔢 Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
          MANUAL_VN: ${{ inputs.version_name }}
          MANUAL_VC: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          CUR_VN=$(grep -oE 'APP_VERSION_NAME = "[^"]+"' capacitor.config.ts | sed -E 's/.*"([^"]+)".*/\1/')
          CUR_VC=$(grep -oE 'APP_VERSION_CODE = [0-9]+' capacitor.config.ts | grep -oE '[0-9]+')

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VN="${GITHUB_REF_NAME#v}"
            VN="${VN%%+*}"
            BUMP="manual"
          fi

          case "${BUMP:-patch}" in
            major) IFS=. read -r MA MI PA <<< "$CUR_VN"; VN="$((MA+1)).0.0" ;;
            minor) IFS=. read -r MA MI PA <<< "$CUR_VN"; VN="${MA}.$((MI+1)).0" ;;
            patch) IFS=. read -r MA MI PA <<< "$CUR_VN"; VN="${MA}.${MI}.$((PA+1))" ;;
            manual)
              [ -n "${MANUAL_VN:-}" ] && VN="$MANUAL_VN" || VN="${VN:-$CUR_VN}"
              ;;
          esac

          # versionCode: manual override OR auto-increment OR current+1
          LAST_TAG_VC=$(git tag -l 'v*+*' | sed -E 's/.*\+([0-9]+)$/\1/' | sort -n | tail -1 || echo "0")
          [ -z "$LAST_TAG_VC" ] && LAST_TAG_VC=0
          if [ -n "${MANUAL_VC:-}" ]; then
            VC="$MANUAL_VC"
          else
            BIGGEST=$CUR_VC
            [ "$LAST_TAG_VC" -gt "$BIGGEST" ] && BIGGEST=$LAST_TAG_VC
            VC=$((BIGGEST + 1))
          fi

          echo "version_name=$VN" >> $GITHUB_OUTPUT
          echo "version_code=$VC" >> $GITHUB_OUTPUT
          echo "tag_name=v${VN}+${VC}" >> $GITHUB_OUTPUT
          echo "── Release v${VN} (build ${VC}) — bump=${BUMP} ──"

      - name: ✏️ Apply version to source files
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          sed -i -E "s/(APP_VERSION_NAME = )\"[^\"]+\"/\1\"${VN}\"/" capacitor.config.ts src/lib/appVersion.ts
          sed -i -E "s/(APP_VERSION_CODE = )[0-9]+/\1${VC}/"          capacitor.config.ts src/lib/appVersion.ts

      - name: 💾 Commit version bump
        if: github.ref_type != 'tag'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capacitor.config.ts src/lib/appVersion.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${{ steps.ver.outputs.version_name }} (build ${{ steps.ver.outputs.version_code }}) [skip ci]"
            git push
          fi

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: "35.0.0"
          cmdline-tools-version: "11076708"

      - name: 📦 Install npm
        run: npm ci --no-audit --no-fund

      - name: 🏗️ Web build (production)
        env:
          CAP_ENV: production
          NODE_ENV: production
        run: npm run build

      - name: 📱 Capacitor sync
        env:
          CAP_ENV: production
        run: |
          [ -d "android" ] || npx cap add android
          npx cap sync android

      - name: 🎨 Generate icons & splash
        run: |
          if [ -f "resources/icon.png" ] && [ -f "resources/splash.png" ]; then
            npx --yes @capacitor/assets generate --android || true
          fi

      - name: 🔢 Patch Gradle versionCode/Name
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/"        android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VN\"/" android/app/build.gradle

      - name: 🔐 Ensure Android permissions
        run: |
          M="android/app/src/main/AndroidManifest.xml"
          for p in INTERNET POST_NOTIFICATIONS; do
            grep -q "android.permission.$p" "$M" || \
              sed -i "s|<application|<uses-permission android:name=\"android.permission.$p\" />\n    <application|" "$M"
          done

      - name: 🔐 Auto-generate Android signing secrets if missing
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -z "${!s}" ] && missing+=("$s")
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "✓ All 4 secrets present"
            echo "AUTO_GENERATED=false" >> $GITHUB_ENV
            { echo "ANDROID_KEYSTORE_BASE64<<E"; echo "$ANDROID_KEYSTORE_BASE64"; echo "E"; } >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"                 >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"           >> $GITHUB_ENV
            exit 0
          fi

          if [ "${#missing[@]}" -ne 4 ]; then
            echo "::error::Partial secrets: ${missing[*]}. Delete remaining secrets or use Keystore Management workflow"
            exit 1
          fi

          echo "::warning::No keystore secrets found — generating new keystore"
          STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          ALIAS=tipstricks
          mkdir -p out backup
          keytool -genkeypair -v -keystore out/release.keystore -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Tips and Tricks, OU=Mobile, O=Lovable App, L=NA, ST=NA, C=US"
          KS_B64=$(base64 -w0 out/release.keystore)
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "::add-mask::$KS_B64"

          echo "$KS_B64"     | gh secret set ANDROID_KEYSTORE_BASE64    --body -
          echo "$STORE_PASS" | gh secret set ANDROID_KEYSTORE_PASSWORD  --body -
          echo "$ALIAS"      | gh secret set ANDROID_KEY_ALIAS          --body -
          echo "$KEY_PASS"   | gh secret set ANDROID_KEY_PASSWORD       --body -

          { echo "ANDROID_KEYSTORE_BASE64<<E"; echo "$KS_B64"; echo "E"; } >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$ALIAS"              >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=$KEY_PASS"        >> $GITHUB_ENV
          echo "AUTO_GENERATED=true"                   >> $GITHUB_ENV

          cp out/release.keystore backup/release.keystore
          echo "$KS_B64" > backup/ANDROID_KEYSTORE_BASE64.txt
          cat > backup/SECRETS.txt <<EOF
          ════════════════════════════════════════════════════
          🔐 Android Signing — BACKUP — KEEP SAFE FOREVER
          ════════════════════════════════════════════════════
          ANDROID_KEYSTORE_PASSWORD = ${STORE_PASS}
          ANDROID_KEY_ALIAS         = ${ALIAS}
          ANDROID_KEY_PASSWORD      = ${KEY_PASS}
          ════════════════════════════════════════════════════
          EOF

      - name: 📦 Upload keystore backup (auto-generated)
        if: env.AUTO_GENERATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-DOWNLOAD-AND-DELETE
          path: backup/
          retention-days: 7

      - name: 🔑 Decode keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          [ "$(stat -c%s android/app/release.keystore)" -ge 1000 ] || { echo "::error::Keystore too small"; exit 1; }

      - name: ✅ Validate keystore
        run: keytool -list -keystore android/app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: ✍️ Inject signing config
        run: |
          F=android/app/build.gradle
          grep -q "signingConfigs" "$F" && exit 0
          cat > /tmp/inject.py <<'PY'
          import re
          p="android/app/build.gradle"; c=open(p).read()
          sc='    signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword System.getenv("KS_PASS")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASS")\n        }\n    }\n'
          c,n=re.subn(r'(android\s*\{\r?\n)', r'\1'+sc, c, 1)
          if not n: raise SystemExit("no android block")
          c2,n=re.subn(r'(buildTypes\s*\{\s*\r?\n\s*release\s*\{\s*\r?\n)', r'\1            signingConfig signingConfigs.release\n', c, 1)
          open(p,"w").write(c2 if n else re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.release', c, 1))
          PY
          python3 /tmp/inject.py

      - name: 📦 Build signed AAB + APK
        env:
          KS_PASS: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: 🏷️ Collect artifacts
        id: collect
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          BR=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd '[:alnum:]._-')
          SHA=$(git rev-parse --short HEAD)
          BASE="tipstricks-v${VN}-vc${VC}-${BR}-${SHA}"
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/${BASE}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk     "out/${BASE}.apk" 2>/dev/null || true
          MAP=android/app/build/outputs/mapping/release/mapping.txt
          [ -f "$MAP" ] && cp "$MAP" "out/${BASE}.mapping.txt" || true
          echo "base=$BASE"          >> $GITHUB_OUTPUT
          echo "aab=out/${BASE}.aab" >> $GITHUB_OUTPUT
          ls -la out/

      - name: 🔍 Verify AAB signature
        env:
          AAB: ${{ steps.collect.outputs.aab }}
        run: |
          unzip -l "$AAB" | grep -E "META-INF/.*\.(RSA|EC|DSA)" >/dev/null || { echo "::error::AAB unsigned"; exit 1; }
          jarsigner -verify -strict "$AAB" >/dev/null
          keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -E "SHA(1|256):" || true
          echo "✅ AAB signed & verified ($(stat -c%s "$AAB") bytes)"

      - name: 📤 Upload artifacts (AAB + APK + mapping)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.base }}
          path: out/
          retention-days: 90

      - name: 📝 Generate changelog
        id: changelog
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -v "${{ steps.ver.outputs.tag_name }}" | head -1 || echo "")
          RANGE="${PREV:+${PREV}..}HEAD"
          {
            echo "## Tips & Tricks — v${VN} (build ${VC})"
            echo ""
            echo "**Branch:** \`${GITHUB_REF_NAME}\` · **Commit:** \`$(git rev-parse --short HEAD)\` · **Date:** $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "### ✨ الميزات"
            git log $RANGE --pretty='- %s (%h)' --grep='^feat' || echo "_لا جديد_"
            echo ""
            echo "### 🐛 الإصلاحات"
            git log $RANGE --pretty='- %s (%h)' --grep='^fix' || echo "_لا جديد_"
            echo ""
            echo "### 🔧 صيانة وتحسينات"
            git log $RANGE --pretty='- %s (%h)' --grep='^chore\|^refactor\|^perf\|^docs\|^style\|^test' || echo "_لا جديد_"
            echo ""
            echo "### 📦 الملفات"
            echo "- \`${{ steps.collect.outputs.base }}.aab\` — للرفع على Google Play"
            echo "- \`${{ steps.collect.outputs.base }}.apk\` — للتثبيت المباشر"
            echo "- \`${{ steps.collect.outputs.base }}.mapping.txt\` — لفك ProGuard في Crashlytics"
          } > CHANGELOG_RELEASE.md
          echo "path=CHANGELOG_RELEASE.md" >> $GITHUB_OUTPUT

      - name: 🚀 GitHub Release
        if: ${{ inputs.create_github_release || github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: v${{ steps.ver.outputs.version_name }} (build ${{ steps.ver.outputs.version_code }})
          body_path: ${{ steps.changelog.outputs.path }}
          files: out/*
          draft: false
          prerelease: false

      - name: 🎯 Detect Play upload availability
        id: play
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
        run: |
          if [ -n "$PLAY_JSON" ] && [ "${TRACK:-none}" != "none" ]; then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Play upload skipped (track=${TRACK:-none}, json_set=$([ -n "$PLAY_JSON" ] && echo yes || echo no))"
          fi

      - name: 🛒 Upload to Google Play
        if: steps.play.outputs.go == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.lovable.f15d3c7d05d949cb9278ed7124c335f7
          releaseFiles: ${{ steps.collect.outputs.aab }}
          track: ${{ inputs.track }}
          status: completed
          mappingFile: out/${{ steps.collect.outputs.base }}.mapping.txt
          whatsNewDirectory: fastlane/metadata/android

      - name: 📣 Telegram notification
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && exit 0
          ICON="✅"; [ "$STATUS" != "success" ] && ICON="❌"
          MSG="${ICON} *Release v${VN}* (build ${VC})%0A%0AStatus: \`${STATUS}\`%0A[فتح Run](${RUN})"
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" -d parse_mode=Markdown -d text="$MSG" >/dev/null || true
