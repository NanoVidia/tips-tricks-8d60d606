name: Build Android AAB

# ==============================================================================
# يبني ملف AAB موقّع على GitHub بدون أي إعداد محلي.
#
# الاستخدام:
#   1) Actions → "Build Android AAB" → Run workflow
#   2) (اختياري) أدخل version_name و version_code للإصدار الجديد
#      - إذا تركتهما فارغين سيستخدم القيم الموجودة في الكود.
#      - عند إدخال قيم جديدة سيتم تحديث:
#          • capacitor.config.ts   (APP_VERSION_NAME / APP_VERSION_CODE)
#          • src/lib/appVersion.ts (المعلومات المعروضة داخل التطبيق)
#          • android/app/build.gradle (versionName / versionCode)
#        ويتم عمل commit تلقائي إذا فعّلت "commit_version_bump".
#   3) حمّل الـ AAB من قسم Artifacts بعد ~8 دقائق.
#
# 🔐 الأسرار المطلوبة (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 من release.keystore (سطر واحد)
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          alias name
#   ANDROID_KEY_PASSWORD       key password
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "رقم الإصدار العام مثل 1.5.0 (اتركه فارغاً للإبقاء على الحالي)"
        required: false
        default: ""
      version_code:
        description: "رقم البناء الداخلي (عدد صحيح يجب أن يزيد كل رفع) — اتركه فارغاً للإبقاء على الحالي"
        required: false
        default: ""
      auto_increment_version_code:
        description: "زيادة version_code تلقائياً (+1) إذا لم يتم إدخال قيمة يدوياً"
        required: false
        default: true
        type: boolean
      commit_version_bump:
        description: "حفظ تحديث الإصدار في المستودع تلقائياً (commit + push)"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────────────────────────
      # 1) تحديث رقم الإصدار في الملفات (قبل أي بناء) إذا أدخل المستخدم قيمة
      # ─────────────────────────────────────────────────────────────────
      - name: 🔢 Apply version inputs (capacitor.config.ts + appVersion.ts)
        id: apply_version
        env:
          IN_VN: ${{ inputs.version_name }}
          IN_VC: ${{ inputs.version_code }}
          IN_AUTO_INC: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_increment_version_code || 'false' }}
        run: |
          set -euo pipefail
          changed=0

          if [ -n "${IN_VN}" ]; then
            echo "→ Updating versionName to '${IN_VN}'"
            sed -i -E "s/(APP_VERSION_NAME = )\"[^\"]+\"/\1\"${IN_VN}\"/" capacitor.config.ts
            sed -i -E "s/(APP_VERSION_NAME = )\"[^\"]+\"/\1\"${IN_VN}\"/" src/lib/appVersion.ts
            changed=1
          fi

          if [ -n "${IN_VC}" ]; then
            if ! [[ "${IN_VC}" =~ ^[0-9]+$ ]]; then
              echo "::error::version_code must be an integer, got '${IN_VC}'"
              exit 1
            fi
            echo "→ Updating versionCode to '${IN_VC}'"
            sed -i -E "s/(APP_VERSION_CODE = )[0-9]+/\1${IN_VC}/" capacitor.config.ts
            sed -i -E "s/(APP_VERSION_CODE = )[0-9]+/\1${IN_VC}/" src/lib/appVersion.ts
            changed=1
          elif [ "${IN_AUTO_INC}" = "true" ]; then
            CUR_VC=$(grep -oE 'APP_VERSION_CODE = [0-9]+' capacitor.config.ts | grep -oE '[0-9]+')
            NEXT_VC=$((CUR_VC + 1))
            echo "→ Auto-incrementing versionCode: ${CUR_VC} -> ${NEXT_VC}"
            sed -i -E "s/(APP_VERSION_CODE = )[0-9]+/\1${NEXT_VC}/" capacitor.config.ts
            sed -i -E "s/(APP_VERSION_CODE = )[0-9]+/\1${NEXT_VC}/" src/lib/appVersion.ts
            changed=1
          fi

          # القيم النهائية (سواء جديدة أو الحالية)
          VN=$(grep -oE 'APP_VERSION_NAME = "[^"]+"' capacitor.config.ts | sed -E 's/.*"([^"]+)".*/\1/')
          VC=$(grep -oE 'APP_VERSION_CODE = [0-9]+' capacitor.config.ts | grep -oE '[0-9]+')
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "changed=$changed"  >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "── Final version: v$VN (build $VC) ──"

      - name: 💾 Commit version bump
        if: ${{ steps.apply_version.outputs.changed == '1' && inputs.commit_version_bump }}
        env:
          VN: ${{ steps.apply_version.outputs.version_name }}
          VC: ${{ steps.apply_version.outputs.version_code }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capacitor.config.ts src/lib/appVersion.ts
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(release): bump to v${VN} (build ${VC}) [skip ci]"
            git push
          fi

      # ─────────────────────────────────────────────────────────────────
      # 2) أدوات البناء
      # ─────────────────────────────────────────────────────────────────
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: "35.0.0"
          cmdline-tools-version: "11076708"

      - name: 📦 Install npm dependencies
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning::npm ci failed — falling back to npm install"
            npm install --no-audit --no-fund
          }

      # ─────────────────────────────────────────────────────────────────
      # 3) بناء الويب — الإصدار محدّث مسبقاً في src/lib/appVersion.ts
      # ─────────────────────────────────────────────────────────────────
      - name: 🏗️ Build web app (production)
        env:
          CAP_ENV: production
          NODE_ENV: production
          VITE_BUILD_DATE: ${{ github.run_started_at }}
        run: npm run build

      - name: 📱 Add Android platform & sync Capacitor
        env:
          CAP_ENV: production
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🎨 Generate Android icons & splash
        run: |
          if [ -f "resources/icon.png" ] && [ -f "resources/splash.png" ]; then
            npx --yes @capacitor/assets generate --android || true
          fi

      # ─────────────────────────────────────────────────────────────────
      # 4) ضبط versionName / versionCode داخل android/app/build.gradle
      # ─────────────────────────────────────────────────────────────────
      - name: 🔢 Patch build.gradle versionCode / versionName
        env:
          VN: ${{ steps.apply_version.outputs.version_name }}
          VC: ${{ steps.apply_version.outputs.version_code }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${VC}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VN}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: 🔐 Ensure required Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          add_perm() {
            local p="$1"
            if ! grep -q "$p" "$MANIFEST"; then
              sed -i "s|<application|<uses-permission android:name=\"$p\" />\n    <application|" "$MANIFEST"
              echo "  + added $p"
            fi
          }
          add_perm "android.permission.INTERNET"
          add_perm "android.permission.POST_NOTIFICATIONS"
          add_perm "com.android.vending.BILLING"

      # ─────────────────────────────────────────────────────────────────
      # 5) keystore + التوقيع
      # ─────────────────────────────────────────────────────────────────
      - name: 🔐 Verify required Android secrets exist
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -uo pipefail

          declare -A SECRET_HINT=(
            [ANDROID_KEYSTORE_BASE64]="ملف release.keystore بعد تحويله إلى Base64 (سطر واحد بدون مسافات)."
            [ANDROID_KEYSTORE_PASSWORD]="كلمة مرور الـ keystore (storepass) المُستخدمة عند توليده."
            [ANDROID_KEY_ALIAS]="اسم الـ alias داخل الـ keystore (مثال: tipstricks)."
            [ANDROID_KEY_PASSWORD]="كلمة مرور المفتاح (keypass). غالباً نفس كلمة الـ keystore."
          )

          missing=()
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            val="${!s}"
            if [ -z "$val" ]; then
              missing+=("$s")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            # تحقق إضافي: طول Base64 يجب أن يكون معقولاً (>= 1400 = ~1KB keystore)
            B64_LEN=${#ANDROID_KEYSTORE_BASE64}
            if [ "$B64_LEN" -lt 1400 ]; then
              echo "::warning::ANDROID_KEYSTORE_BASE64 length is suspiciously small ($B64_LEN chars). The keystore may be corrupted."
            fi
            echo "✓ All four Android signing secrets are present (base64 length: $B64_LEN chars)"
            {
              echo "## ✅ Android signing secrets verified"
              echo ""
              echo "| Secret | Status |"
              echo "|---|---|"
              echo "| \`ANDROID_KEYSTORE_BASE64\` | present ($B64_LEN chars) |"
              echo "| \`ANDROID_KEYSTORE_PASSWORD\` | present |"
              echo "| \`ANDROID_KEY_ALIAS\` | present |"
              echo "| \`ANDROID_KEY_PASSWORD\` | present |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ─── المفقودة: اعرض إرشادات تفصيلية ───
          echo "::error::Missing ${#missing[@]} required Android signing secret(s): ${missing[*]}"

          {
            echo "## ❌ Android signing secrets missing"
            echo ""
            echo "The build cannot continue without all four signing secrets."
            echo ""
            echo "### Missing secrets"
            echo ""
            echo "| Secret | What it is |"
            echo "|---|---|"
            for s in "${missing[@]}"; do
              echo "| \`$s\` | ${SECRET_HINT[$s]} |"
            done
            echo ""
            echo "### How to restore — pick ONE of the options below"
            echo ""
            echo "#### Option A — Import an existing keystore (recommended if the app is already on Google Play)"
            echo ""
            echo "If you have the original \`release.keystore\` file backed up somewhere safe:"
            echo ""
            echo "1. Convert it to Base64 on your machine:"
            echo "   - **macOS:** \`base64 -i release.keystore | tr -d '\\n' | pbcopy\`"
            echo "   - **Linux:** \`base64 -w0 release.keystore | xclip -selection clipboard\`"
            echo "   - **Windows PowerShell:** \`[Convert]::ToBase64String([IO.File]::ReadAllBytes('release.keystore')) | Set-Clipboard\`"
            echo "2. Open [**Import Existing Android Keystore**](${REPO_URL}/actions/workflows/import-keystore.yml) → **Run workflow**."
            echo "3. Paste the Base64, the keystore password, and the alias. Press Run."
            echo "4. Re-run this build."
            echo ""
            echo "> ⚠️ **Critical:** Google Play rejects any AAB signed with a different keystore than the original. If the app is already published, you MUST use Option A."
            echo ""
            echo "#### Option B — Generate a brand new keystore (only for first-time / unpublished apps)"
            echo ""
            echo "1. Open [**Setup Android Signing Secrets (one-time)**](${REPO_URL}/actions/workflows/generate-keystore.yml) → **Run workflow**."
            echo "2. Wait ~30 seconds. The four secrets will be uploaded to this repo automatically."
            echo "3. Re-run this build."
            echo ""
            echo "#### Option C — Add the secrets manually"
            echo ""
            echo "Go to [**Settings → Secrets and variables → Actions**](${REPO_URL}/settings/secrets/actions) and add each missing secret with the values from your password manager / backup."
            echo ""
            echo "### Where the secrets live"
            echo ""
            echo "These secrets are stored **inside this GitHub repository**, not in Lovable. When you move the project to a new repository, they do **not** transfer — you must re-import them using Option A above."
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "──────────────────────────────────────────────────────────────"
          echo " 🔧 RESTORE INSTRUCTIONS (full details in the job summary tab)"
          echo "──────────────────────────────────────────────────────────────"
          echo " Recommended: Run the 'Import Existing Android Keystore' workflow"
          echo "   → ${REPO_URL}/actions/workflows/import-keystore.yml"
          echo ""
          echo " First-time only: Run 'Setup Android Signing Secrets (one-time)'"
          echo "   → ${REPO_URL}/actions/workflows/generate-keystore.yml"
          echo ""
          echo " Manual: Add secrets in repo settings"
          echo "   → ${REPO_URL}/settings/secrets/actions"
          echo "──────────────────────────────────────────────────────────────"
          exit 1

      - name: 🔑 Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          SIZE=$(stat -c%s android/app/release.keystore)
          echo "Keystore decoded — $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Decoded keystore too small ($SIZE bytes) — secret likely corrupt"
            exit 1
          fi

      - name: ✅ Validate keystore credentials
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing keystore credentials (ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD)"
            exit 1
          fi
          if ! keytool -list -keystore android/app/release.keystore -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore password OR alias is wrong"
            exit 1
          fi
          echo "✓ Keystore credentials look valid"

      - name: ✍️ Inject signing config into build.gradle
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if grep -q "signingConfigs" "$GRADLE_FILE"; then
            echo "signingConfigs already present"
          else
            cat > /tmp/inject_signing.py <<'PY'
          import re
          path = "android/app/build.gradle"
          content = open(path).read()
          signing_block = (
              '    signingConfigs {\n'
              '        release {\n'
              '            storeFile file("release.keystore")\n'
              '            storePassword System.getenv("KS_PASS")\n'
              '            keyAlias System.getenv("KEY_ALIAS")\n'
              '            keyPassword System.getenv("KEY_PASS")\n'
              '        }\n'
              '    }\n'
          )
          new, n = re.subn(r'(android\s*\{\r?\n)', r'\1' + signing_block, content, count=1)
          if n == 0:
              raise SystemExit("Could not find 'android {' block in build.gradle")
          content = new
          new, n = re.subn(
              r'(buildTypes\s*\{\s*\r?\n\s*release\s*\{\s*\r?\n)',
              r'\1            signingConfig signingConfigs.release\n',
              content, count=1,
          )
          if n == 0:
              new = re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.release', content, count=1)
          open(path, "w").write(new)
          print("signingConfigs injected")
          PY
            python3 /tmp/inject_signing.py
          fi
          echo "── build.gradle (relevant lines) ──"
          grep -nE "signingConfig|versionCode|versionName" "$GRADLE_FILE" || true

      # ─────────────────────────────────────────────────────────────────
      # 6) البناء + التحقق
      # ─────────────────────────────────────────────────────────────────
      - name: 📦 Build signed AAB
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 🔍 Verify AAB is signed
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "::error::AAB file not found at $AAB"; exit 1
          fi
          SIZE=$(stat -c%s "$AAB")
          echo "AAB size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::AAB suspiciously small ($SIZE bytes)"; exit 1
          fi
          if ! unzip -l "$AAB" | grep -E "META-INF/.*\.(RSA|EC|DSA)" ; then
            echo "::error::AAB is NOT signed"; exit 1
          fi
          if ! jarsigner -verify -strict "$AAB" > /tmp/jarsigner.log 2>&1 ; then
            echo "::error::jarsigner verification failed"; cat /tmp/jarsigner.log; exit 1
          fi
          echo "✓ jarsigner verified"
          echo "── Certificate fingerprint ──"
          keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -E "SHA(1|256):" || true

      - name: 📝 Rename AAB with version
        id: rename
        env:
          VN: ${{ steps.apply_version.outputs.version_name }}
          VC: ${{ steps.apply_version.outputs.version_code }}
          SHA: ${{ steps.apply_version.outputs.short_sha }}
        run: |
          SRC="android/app/build/outputs/bundle/release/app-release.aab"
          OUT_DIR="dist-aab"
          mkdir -p "$OUT_DIR"
          NAME="tipstricks-v${VN}-vc${VC}-${SHA}.aab"
          cp "$SRC" "$OUT_DIR/$NAME"
          echo "aab_path=$OUT_DIR/$NAME" >> "$GITHUB_OUTPUT"
          echo "aab_name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT_DIR/$NAME"

      - name: 📤 Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tipstricks-v${{ steps.apply_version.outputs.version_name }}-vc${{ steps.apply_version.outputs.version_code }}
          path: ${{ steps.rename.outputs.aab_path }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: ✅ Summary
        env:
          VN: ${{ steps.apply_version.outputs.version_name }}
          VC: ${{ steps.apply_version.outputs.version_code }}
          SHA: ${{ steps.apply_version.outputs.short_sha }}
          AAB_NAME: ${{ steps.rename.outputs.aab_name }}
          BUMPED: ${{ steps.apply_version.outputs.changed }}
          COMMITTED: ${{ inputs.commit_version_bump }}
        run: |
          {
            echo "## ✅ Build successful!"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| App | Tips & Tricks Daily Quiz |"
            echo "| Application ID | \`app.lovable.tipstricks\` |"
            echo "| Version name | \`${VN}\` |"
            echo "| Version code | \`${VC}\` |"
            echo "| Commit | \`${SHA}\` |"
            echo "| Version bumped this run? | \`${BUMPED}\` |"
            echo "| Auto-committed? | \`${COMMITTED}\` |"
            echo "| Artifact file | \`${AAB_NAME}\` |"
            echo ""
            echo "📥 حمّل الـ AAB من قسم **Artifacts** أعلى الصفحة وارفعه إلى Google Play Console."
          } >> "$GITHUB_STEP_SUMMARY"
