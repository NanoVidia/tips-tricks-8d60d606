name: Build Android AAB

# ==============================================================================
# يبني ملف AAB موقّع على GitHub بدون الحاجة لأي إعداد محلي.
#
# الاستخدام:
#   1. أضف الأسرار الأربعة (انظر أسفل هذا الملف).
#   2. Actions → "Build Android AAB" → Run workflow.
#   3. حمّل الـ AAB من قسم Artifacts بعد ~8 دقائق.
# ==============================================================================

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: "35.0.0"
          cmdline-tools-version: "11076708"

      - name: 📦 Install npm dependencies
        run: |
          # npm ci أسرع لكنه يفشل عند أي اختلاف. نحاوله أولاً ثم نسقط لـ install.
          npm ci --no-audit --no-fund || {
            echo "::warning::npm ci failed — falling back to npm install"
            npm install --no-audit --no-fund
          }

      - name: 🏗️ Build web app (production)
        env:
          CAP_ENV: production
          NODE_ENV: production
        run: npm run build

      - name: 📱 Add Android platform & sync Capacitor
        env:
          CAP_ENV: production
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🎨 Generate Android icons & splash
        run: |
          if [ -f "resources/icon.png" ] && [ -f "resources/splash.png" ]; then
            npx --yes @capacitor/assets generate --android || true
          fi

      - name: 🔢 Patch versionCode / versionName
        id: version
        run: |
          VERSION_NAME=$(grep -oE 'APP_VERSION_NAME = "[^"]+"' capacitor.config.ts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -oE 'APP_VERSION_CODE = [0-9]+' capacitor.config.ts | grep -oE '[0-9]+')
          echo "Using versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 🔐 Ensure required Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          add_perm() {
            local p="$1"
            if ! grep -q "$p" "$MANIFEST"; then
              sed -i "s|<application|<uses-permission android:name=\"$p\" />\n    <application|" "$MANIFEST"
              echo "  + added $p"
            fi
          }
          add_perm "android.permission.INTERNET"
          add_perm "android.permission.POST_NOTIFICATIONS"
          add_perm "com.android.vending.BILLING"

      - name: 🔑 Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          SIZE=$(stat -c%s android/app/release.keystore)
          echo "Keystore decoded — $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Decoded keystore is too small ($SIZE bytes). Secret content is likely corrupt or contains line breaks."
            exit 1
          fi

      - name: ✅ Validate keystore credentials
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS secret"
            exit 1
          fi
          if ! keytool -list -keystore android/app/release.keystore -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore password OR alias is wrong (alias '$KEY_ALIAS' not found / wrong store password)."
            echo "Check secrets: ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS"
            exit 1
          fi
          echo "✓ Keystore credentials look valid"

      - name: 🔎 Print keystore entries (no secrets)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "── Keystore entries ──"
          keytool -list -keystore android/app/release.keystore -storepass "$KS_PASS" -v 2>/dev/null | grep -E "Alias|Entry type|Creation date" || \
          keytool -list -keystore android/app/release.keystore -storepass "$KS_PASS" 2>/dev/null
          echo "── Make sure ANDROID_KEY_ALIAS matches one of the aliases above ──"

      - name: ✍️ Inject signing config into build.gradle
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if ! grep -q "signingConfigs" "$GRADLE_FILE"; then
            python3 - <<'PY'
            import re
            path = "android/app/build.gradle"
            content = open(path).read()
            signing_block = '''    signingConfigs {
                release {
                    storeFile file("release.keystore")
                    storePassword System.getenv("KS_PASS")
                    keyAlias System.getenv("KEY_ALIAS")
                    keyPassword System.getenv("KEY_PASS")
                }
            }
            '''
            new, n = re.subn(r'(android\s*\{\r?\n)', r'\1' + signing_block, content, count=1)
            if n == 0:
                raise SystemExit("Could not find 'android {' block in build.gradle")
            content = new
            new, n = re.subn(
                r'(buildTypes\s*\{\s*\r?\n\s*release\s*\{\s*\r?\n)',
                r'\1            signingConfig signingConfigs.release\n',
                content, count=1,
            )
            if n == 0:
                # fallback: append signingConfig inside any release { } block
                new = re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.release', content, count=1)
            open(path, "w").write(new)
            print("✓ signingConfigs injected")
            PY
          fi
          echo "── build.gradle (relevant lines) ──"
          grep -n -E "signingConfig|versionCode|versionName" "$GRADLE_FILE" || true

      - name: 📦 Build signed AAB
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 🔍 Verify AAB is signed
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "::error::AAB file not found at $AAB"
            exit 1
          fi
          SIZE=$(stat -c%s "$AAB")
          echo "AAB size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::AAB suspiciously small ($SIZE bytes)"
            exit 1
          fi
          if ! unzip -l "$AAB" | grep -E "META-INF/.*\.(RSA|EC|DSA)" ; then
            echo "::error::AAB is NOT signed"
            exit 1
          fi
          if ! jarsigner -verify -strict "$AAB" > /tmp/jarsigner.log 2>&1 ; then
            echo "::error::jarsigner verification failed"
            cat /tmp/jarsigner.log
            exit 1
          fi
          echo "✓ jarsigner verified"
          echo "── Certificate fingerprint ──"
          keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -E "SHA(1|256):" || true
          echo "✅ AAB is properly signed"

      - name: 📝 Rename AAB with version
        id: rename
        run: |
          SRC="android/app/build/outputs/bundle/release/app-release.aab"
          OUT_DIR="dist-aab"
          mkdir -p "$OUT_DIR"
          NAME="tipstricks-v${{ steps.version.outputs.version_name }}-vc${{ steps.version.outputs.version_code }}-${{ steps.version.outputs.short_sha }}.aab"
          cp "$SRC" "$OUT_DIR/$NAME"
          echo "aab_path=$OUT_DIR/$NAME" >> "$GITHUB_OUTPUT"
          echo "aab_name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT_DIR/$NAME"

      - name: 📤 Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tipstricks-v${{ steps.version.outputs.version_name }}-vc${{ steps.version.outputs.version_code }}
          path: ${{ steps.rename.outputs.aab_path }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: ✅ Summary
        run: |
          {
            echo "## ✅ Build successful!"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| App | Tips & Tricks Daily Quiz |"
            echo "| Application ID | \`app.lovable.tipstricks\` |"
            echo "| Version name | \`${{ steps.version.outputs.version_name }}\` |"
            echo "| Version code | \`${{ steps.version.outputs.version_code }}\` |"
            echo "| Commit | \`${{ steps.version.outputs.short_sha }}\` |"
            echo "| Artifact file | \`${{ steps.rename.outputs.aab_name }}\` |"
            echo ""
            echo "📥 حمّل الـ AAB من قسم **Artifacts** في أعلى الصفحة وارفعه إلى Google Play Console."
          } >> $GITHUB_STEP_SUMMARY

# ==============================================================================
# 🔐 Required Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 من release.keystore (سطر واحد، بلا BEGIN/END)
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          alias name (e.g. tipstricks)
#   ANDROID_KEY_PASSWORD       key password
# ==============================================================================
