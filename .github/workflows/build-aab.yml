name: Build Android AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "رقم الإصدار الظاهر للمستخدمين. فارغ = زيادة patch تلقائياً"
        required: false
        default: ""
      version_code:
        description: "رقم البناء الداخلي. فارغ = current + 1"
        required: false
        default: ""
      create_release:
        description: "إنشاء GitHub Release مع ملف الـ AAB"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: build-aab
  cancel-in-progress: false

jobs:
  build:
    name: Build · Sign · Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔢 Compute version
        id: ver
        env:
          IN_VN: ${{ inputs.version_name }}
          IN_VC: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          CUR_VN=$(grep -oE 'APP_VERSION_NAME = "[^"]+"' capacitor.config.ts | sed -E 's/.*"([^"]+)".*/\1/')
          CUR_VC=$(grep -oE 'APP_VERSION_CODE = [0-9]+' capacitor.config.ts | grep -oE '[0-9]+')

          if [ -n "$IN_VN" ]; then
            VN="$IN_VN"
          else
            IFS=. read -r MA MI PA <<< "$CUR_VN"
            VN="${MA}.${MI}.$((PA + 1))"
          fi

          if [ -n "$IN_VC" ]; then
            VC="$IN_VC"
          else
            VC=$((CUR_VC + 1))
          fi

          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VN}+${VC}" >> "$GITHUB_OUTPUT"

      - name: ✏️ Apply version to source
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          set -euo pipefail
          sed -i -E "s/(APP_VERSION_NAME = )\"[^\"]+\"/\1\"${VN}\"/" capacitor.config.ts src/lib/appVersion.ts
          sed -i -E "s/(APP_VERSION_CODE = )[0-9]+/\1${VC}/" capacitor.config.ts src/lib/appVersion.ts

      - name: 💾 Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capacitor.config.ts src/lib/appVersion.ts
          git diff --cached --quiet || {
            git commit -m "chore(release): v${{ steps.ver.outputs.version_name }} (build ${{ steps.ver.outputs.version_code }}) [skip ci]"
            git push
          }

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: "35.0.0"
          cmdline-tools-version: "11076708"

      - name: 🧰 Preflight tools
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v keytool >/dev/null
          command -v jarsigner >/dev/null
          chmod +x scripts/validate-android-keystore.sh

      - name: 📦 Install dependencies
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps \
            || npm install --no-audit --no-fund --legacy-peer-deps

      - name: 🏗️ Build web app
        env:
          CAP_ENV: production
          NODE_ENV: production
        run: npm run build

      - name: 📱 Prepare Android platform
        env:
          CAP_ENV: production
        run: |
          set -euo pipefail
          if [ ! -f "android/app/build.gradle" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🔢 Patch Gradle version
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          set -euo pipefail
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VN\"/" android/app/build.gradle

      - name: 🔐 Ensure Android signing secrets
        env:
          GH_REPO_ADMIN_TOKEN: ${{ secrets.GH_REPO_ADMIN_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!s:-}" ] || missing=$((missing + 1))
          done

          VALID=false
          if [ "$missing" -eq 0 ]; then
            mkdir -p out
            if echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > out/existing.keystore 2>/dev/null \
              && scripts/validate-android-keystore.sh out/existing.keystore "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" >/tmp/keystore-check.log 2>&1; then
              VALID=true
            fi
            rm -f out/existing.keystore
          fi

          if [ "$VALID" = "true" ]; then
            {
              echo "ANDROID_KEYSTORE_BASE64<<EOF_SECRET"
              echo "$ANDROID_KEYSTORE_BASE64"
              echo "EOF_SECRET"
            } >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "AUTO_GENERATED=false" >> "$GITHUB_ENV"
            {
              echo "## ✅ Android signing جاهز"
              echo ""
              echo "تم التحقق من keystore الحالي واستكمال البناء به."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${GH_REPO_ADMIN_TOKEN:-}" ]; then
            {
              echo "## ❌ تعذّر إكمال Android signing تلقائياً"
              echo ""
              echo "الأسرار الأربعة غير موجودة أو غير متطابقة، وGitHub لا يسمح للـ workflow بإنشاء Repository Secrets من نفسه بدون توكن إداري صريح."
              echo ""
              echo "### المطلوب مرة واحدة فقط"
              echo "1. أنشئ Classic PAT من GitHub بصلاحية \`repo\`."
              echo "2. أضفه في Secrets باسم \`GH_REPO_ADMIN_TOKEN\`."
              echo "3. شغّل هذا الـ workflow مرة أخرى — عندها سيُولّد keystore جديداً ويحفظ الأسرار الأربعة تلقائياً لكل البناءات القادمة."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing Android signing bootstrap::GH_REPO_ADMIN_TOKEN is required once to create repository secrets automatically"
            exit 1
          fi

          STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          KEY_PASS="$STORE_PASS"
          ALIAS="tipstricks"

          mkdir -p out backup
          keytool -genkeypair -v \
            -keystore out/release.keystore \
            -alias "$ALIAS" \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Tips and Tricks, OU=Mobile, O=Lovable App, L=NA, ST=NA, C=US" >/dev/null

          KS_B64=$(base64 -w0 out/release.keystore)
          echo "::add-mask::$KS_B64"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          export GH_TOKEN="$GH_REPO_ADMIN_TOKEN"
          echo "$KS_B64" | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY" --body -
          echo "$STORE_PASS" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" --body -
          echo "$ALIAS" | gh secret set ANDROID_KEY_ALIAS --repo "$GITHUB_REPOSITORY" --body -
          echo "$KEY_PASS" | gh secret set ANDROID_KEY_PASSWORD --repo "$GITHUB_REPOSITORY" --body -

          {
            echo "ANDROID_KEYSTORE_BASE64<<EOF_SECRET"
            echo "$KS_B64"
            echo "EOF_SECRET"
          } >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "AUTO_GENERATED=true" >> "$GITHUB_ENV"

          cp out/release.keystore backup/release.keystore
          cat > backup/SECRETS.txt <<TXT
          Android signing backup
          ======================
          ANDROID_KEYSTORE_PASSWORD=${STORE_PASS}
          ANDROID_KEY_ALIAS=${ALIAS}
          ANDROID_KEY_PASSWORD=${KEY_PASS}
          TXT

          {
            echo "## ✅ تم إنشاء Android signing تلقائياً"
            echo ""
            echo "تم توليد keystore جديد وحفظ الأسرار الأربعة داخل المستودع."
            echo "نزّل artifact الاحتياطي واحفظه في مكان آمن لأن هذا هو مفتاح تحديثات Google Play المستقبلية."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Upload keystore backup
        if: env.AUTO_GENERATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-DOWNLOAD-AND-DELETE
          path: backup/
          retention-days: 7

      - name: 🔑 Decode keystore
        run: |
          set -euo pipefail
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          scripts/validate-android-keystore.sh \
            android/app/release.keystore \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD"

      - name: ✍️ Inject signing config
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          path = 'android/app/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          if 'signingConfigs {' not in content:
              block = '''    signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS") ?: "tipstricks"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
              content, n = re.subn(r'(android\s*\{\s*\n)', r'\1' + block, content, count=1)
              if n == 0:
                  raise SystemExit('Could not find android block in android/app/build.gradle')

          if 'signingConfig signingConfigs.release' not in content:
              content, n = re.subn(
                  r'(buildTypes\s*\{\s*\n\s*release\s*\{\s*\n)',
                  r'\1            signingConfig signingConfigs.release\n',
                  content,
                  count=1,
              )
              if n == 0:
                  raise SystemExit('Could not inject signingConfig into release buildType')

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PY

      - name: 🏗️ Build signed AAB
        id: gradle_build
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: 🩺 Diagnose Gradle failure
        if: failure() && steps.gradle_build.conclusion == 'failure'
        run: |
          LOG=/tmp/gradle.log
          [ -f "$LOG" ] || exit 0
          {
            echo "## ❌ فشل بناء Android AAB"
            echo ""
            echo "### آخر 50 سطراً من السجل"
            echo '```'
            tail -n 50 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🏷️ Collect AAB
        id: collect
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          set -euo pipefail
          BASE="tipstricks-v${VN}-vc${VC}"
          mkdir -p dist-out
          cp android/app/build/outputs/bundle/release/app-release.aab "dist-out/${BASE}.aab"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "aab=dist-out/${BASE}.aab" >> "$GITHUB_OUTPUT"

      - name: 🔍 Verify AAB signature
        env:
          AAB: ${{ steps.collect.outputs.aab }}
        run: |
          set -euo pipefail
          jarsigner -verify -strict "$AAB" >/dev/null
          AAB_SHA=$(keytool -printcert -jarfile "$AAB" 2>/dev/null | awk '/SHA256:/ {print $2; exit}')
          KS_SHA=$(keytool -list -v -keystore android/app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" 2>/dev/null | awk '/SHA256:/ {print $2; exit}')
          [ "$AAB_SHA" = "$KS_SHA" ] || { echo "::error::Signature mismatch"; exit 1; }

          {
            echo "## ✅ AAB جاهز"
            echo ""
            echo "- Version: \`${{ steps.ver.outputs.version_name }}\`"
            echo "- Build: \`${{ steps.ver.outputs.version_code }}\`"
            echo "- SHA-256: \`${AAB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.base }}
          path: dist-out/
          retention-days: 90

      - name: 🚀 Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: v${{ steps.ver.outputs.version_name }} (build ${{ steps.ver.outputs.version_code }})
          files: dist-out/*
          draft: false
          prerelease: false
