name: Build AAB

# ==============================================================================
# 🏗️  Build signed Android App Bundle (AAB) — Ideal workflow
# ------------------------------------------------------------------------------
# • يدوي فقط (workflow_dispatch).
# • أدخل version_name و version_code، أو اتركهما فارغين لتزايد تلقائي.
# • يولّد keystore جديداً تلقائياً إن لم تكن أسرار التوقيع موجودة،
#   ويحفظها داخل GitHub Secrets إذا كان GH_REPO_ADMIN_TOKEN متاحاً
#   (وإلا فنسخة احتياطية في artifact لمرّة واحدة).
# • يبني AAB موقّع، يتحقق منه، ويرفعه كـ artifact + GitHub Release.
#
# الأسرار:
#   ✅ ANDROID_KEYSTORE_BASE64 / _PASSWORD / _ALIAS / ANDROID_KEY_PASSWORD
#      → تُولَّد تلقائياً عند أول تشغيل إن لم تكن موجودة.
#   ⚪ GH_REPO_ADMIN_TOKEN — اختياري، لحفظ الأسرار المولَّدة في المستودع.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "رقم الإصدار العام (مثل 1.2.0). فارغ = ترقية patch تلقائية."
        required: false
        default: ""
      version_code:
        description: "versionCode الداخلي. فارغ = current + 1."
        required: false
        default: ""
      create_release:
        description: "إنشاء GitHub Release بالـ AAB"
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: build-aab
  cancel-in-progress: false

jobs:
  build:
    name: Build · Sign · Verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────
      # 1) Compute version
      # ─────────────────────────────────────────────────────────────
      - name: 🔢 Compute version
        id: ver
        env:
          IN_VN: ${{ inputs.version_name }}
          IN_VC: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          CUR_VN=$(grep -oE 'APP_VERSION_NAME = "[^"]+"' capacitor.config.ts | sed -E 's/.*"([^"]+)".*/\1/')
          CUR_VC=$(grep -oE 'APP_VERSION_CODE = [0-9]+' capacitor.config.ts | grep -oE '[0-9]+')

          if [ -n "$IN_VN" ]; then
            VN="$IN_VN"
          else
            IFS=. read -r MA MI PA <<< "$CUR_VN"
            VN="${MA}.${MI}.$((PA+1))"
          fi

          if [ -n "$IN_VC" ]; then
            VC="$IN_VC"
          else
            VC=$((CUR_VC + 1))
          fi

          echo "version_name=$VN" >> $GITHUB_OUTPUT
          echo "version_code=$VC" >> $GITHUB_OUTPUT
          echo "tag_name=v${VN}+${VC}" >> $GITHUB_OUTPUT
          echo "── Building v${VN} (build ${VC}) ──"

      - name: ✏️ Apply version to source
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          sed -i -E "s/(APP_VERSION_NAME = )\"[^\"]+\"/\1\"${VN}\"/" capacitor.config.ts src/lib/appVersion.ts
          sed -i -E "s/(APP_VERSION_CODE = )[0-9]+/\1${VC}/"          capacitor.config.ts src/lib/appVersion.ts

      - name: 💾 Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capacitor.config.ts src/lib/appVersion.ts
          git diff --cached --quiet || {
            git commit -m "chore(release): v${{ steps.ver.outputs.version_name }} (build ${{ steps.ver.outputs.version_code }}) [skip ci]"
            git push
          }

      # ─────────────────────────────────────────────────────────────
      # 2) Toolchain
      # ─────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21" }
      - uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: "35.0.0"
          cmdline-tools-version: "11076708"

      - name: 📦 npm install
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: 🏗️ Web build
        env:
          CAP_ENV: production
          NODE_ENV: production
        run: npm run build

      - name: 📱 Capacitor sync
        env:
          CAP_ENV: production
        run: |
          [ -d "android" ] || npx cap add android
          npx cap sync android

      - name: 🔢 Patch Gradle version
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/"          android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VN\"/"  android/app/build.gradle

      # ─────────────────────────────────────────────────────────────
      # 3) Auto-generate signing secrets if missing
      # ─────────────────────────────────────────────────────────────
      - name: 🔐 Ensure signing secrets
        env:
          GH_REPO_ADMIN_TOKEN: ${{ secrets.GH_REPO_ADMIN_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -z "${!s}" ] && missing=$((missing+1))
          done

          if [ "$missing" -eq 0 ]; then
            echo "✓ All signing secrets present"
            { echo "ANDROID_KEYSTORE_BASE64<<E"; echo "$ANDROID_KEYSTORE_BASE64"; echo "E"; } >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"                 >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"           >> $GITHUB_ENV
            echo "AUTO_GENERATED=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "::warning::Generating new release keystore ($missing secrets missing)"
          STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          ALIAS=tipstricks
          mkdir -p out backup
          keytool -genkeypair -v -keystore out/release.keystore -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Tips and Tricks, OU=Mobile, O=Lovable App, L=NA, ST=NA, C=US"
          KS_B64=$(base64 -w0 out/release.keystore)
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "::add-mask::$KS_B64"

          if [ -n "${GH_REPO_ADMIN_TOKEN:-}" ]; then
            export GH_TOKEN="$GH_REPO_ADMIN_TOKEN"
            for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              gh secret delete "$s" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            done
            echo "$KS_B64"     | gh secret set ANDROID_KEYSTORE_BASE64    --repo "$GITHUB_REPOSITORY" --body -
            echo "$STORE_PASS" | gh secret set ANDROID_KEYSTORE_PASSWORD  --repo "$GITHUB_REPOSITORY" --body -
            echo "$ALIAS"      | gh secret set ANDROID_KEY_ALIAS          --repo "$GITHUB_REPOSITORY" --body -
            echo "$KEY_PASS"   | gh secret set ANDROID_KEY_PASSWORD       --repo "$GITHUB_REPOSITORY" --body -
            echo "✅ Saved to repository secrets"
          else
            echo "::warning::GH_REPO_ADMIN_TOKEN not set — keystore kept only as artifact for this run"
          fi

          { echo "ANDROID_KEYSTORE_BASE64<<E"; echo "$KS_B64"; echo "E"; } >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$ALIAS"              >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=$KEY_PASS"        >> $GITHUB_ENV
          echo "AUTO_GENERATED=true"                   >> $GITHUB_ENV

          cp out/release.keystore backup/release.keystore
          cat > backup/SECRETS.txt <<EOF
          ANDROID_KEYSTORE_PASSWORD = ${STORE_PASS}
          ANDROID_KEY_ALIAS         = ${ALIAS}
          ANDROID_KEY_PASSWORD      = ${KEY_PASS}
          EOF

      - name: 📦 Upload keystore backup
        if: env.AUTO_GENERATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-DOWNLOAD-AND-DELETE
          path: backup/
          retention-days: 7

      # ─────────────────────────────────────────────────────────────
      # 4) Sign + build
      # ─────────────────────────────────────────────────────────────
      - name: 🔑 Decode keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          [ "$(stat -c%s android/app/release.keystore)" -ge 1000 ] || { echo "::error::Keystore too small"; exit 1; }

      - name: ✍️ Inject signing config
        run: |
          F=android/app/build.gradle
          grep -q "signingConfigs" "$F" && exit 0
          python3 - <<'PY'
          import re
          p="android/app/build.gradle"; c=open(p).read()
          sc='    signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword System.getenv("KS_PASS")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASS")\n        }\n    }\n'
          c,_=re.subn(r'(android\s*\{\r?\n)', r'\1'+sc, c, 1)
          c,_=re.subn(r'(buildTypes\s*\{\s*\r?\n\s*release\s*\{\s*\r?\n)', r'\1            signingConfig signingConfigs.release\n', c, 1)
          open(p,"w").write(c)
          PY

      - name: 🏗️ Build signed AAB
        env:
          KS_PASS: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 🏷️ Collect AAB
        id: collect
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          BASE="tipstricks-v${VN}-vc${VC}"
          mkdir -p dist-out
          cp android/app/build/outputs/bundle/release/app-release.aab "dist-out/${BASE}.aab"
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "aab=dist-out/${BASE}.aab" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────────────────────────
      # 5) Verify signature + Play compliance
      # ─────────────────────────────────────────────────────────────
      - name: 🔍 Verify AAB
        env:
          AAB: ${{ steps.collect.outputs.aab }}
        run: |
          set -euo pipefail
          jarsigner -verify -strict "$AAB" >/dev/null
          AAB_SHA=$(keytool -printcert -jarfile "$AAB" 2>/dev/null | awk '/SHA256:/ {print $2; exit}')
          KS_SHA=$(keytool -list -v -keystore android/app/release.keystore \
                    -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                    -alias "$ANDROID_KEY_ALIAS" 2>/dev/null \
                    | awk '/SHA256:/ {print $2; exit}')
          [ "$AAB_SHA" = "$KS_SHA" ] || { echo "::error::Signature mismatch"; exit 1; }
          echo "✅ AAB signed correctly (SHA256: $AAB_SHA)"

      - name: 📤 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.base }}
          path: dist-out/
          retention-days: 90

      # ─────────────────────────────────────────────────────────────
      # 6) GitHub Release (optional)
      # ─────────────────────────────────────────────────────────────
      - name: 🚀 GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: v${{ steps.ver.outputs.version_name }} (build ${{ steps.ver.outputs.version_code }})
          files: dist-out/*
          draft: false
          prerelease: false
