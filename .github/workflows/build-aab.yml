name: Build AAB

# ==============================================================================
# 🏗️  Build signed Android App Bundle (AAB) — Ideal workflow
# ------------------------------------------------------------------------------
# • يدوي فقط (workflow_dispatch).
# • أدخل version_name و version_code، أو اتركهما فارغين لتزايد تلقائي.
# • يولّد keystore جديداً تلقائياً إن لم تكن أسرار التوقيع موجودة،
#   ويحفظها داخل GitHub Secrets إذا كان GH_REPO_ADMIN_TOKEN متاحاً
#   (وإلا فنسخة احتياطية في artifact لمرّة واحدة).
# • يبني AAB موقّع، يتحقق منه، ويرفعه كـ artifact + GitHub Release.
#
# الأسرار:
#   ✅ ANDROID_KEYSTORE_BASE64 / _PASSWORD / _ALIAS / ANDROID_KEY_PASSWORD
#      → تُولَّد تلقائياً عند أول تشغيل إن لم تكن موجودة.
#   ⚪ GH_REPO_ADMIN_TOKEN — اختياري، لحفظ الأسرار المولَّدة في المستودع.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "رقم الإصدار العام (مثل 1.2.0). فارغ = ترقية patch تلقائية."
        required: false
        default: ""
      version_code:
        description: "versionCode الداخلي. فارغ = current + 1."
        required: false
        default: ""
      create_release:
        description: "إنشاء GitHub Release بالـ AAB"
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: build-aab
  cancel-in-progress: false

jobs:
  build:
    name: Build · Sign · Verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────
      # 0) Preflight — PAT اختياري؛ يُستخدم لحفظ الأسرار دائماً إن وُجد
      # ─────────────────────────────────────────────────────────────
      - name: 🛂 Preflight · detect admin token
        env:
          GH_REPO_ADMIN_TOKEN: ${{ secrets.GH_REPO_ADMIN_TOKEN }}
        run: |
          if [ -n "${GH_REPO_ADMIN_TOKEN:-}" ]; then
            echo "HAS_ADMIN_TOKEN=true" >> $GITHUB_ENV
            echo "✓ GH_REPO_ADMIN_TOKEN موجود — سيتم حفظ أي أسرار مولّدة بشكل دائم"
          else
            echo "HAS_ADMIN_TOKEN=false" >> $GITHUB_ENV
            echo "::notice::GH_REPO_ADMIN_TOKEN غير موجود — البناء سيستمر، وفي حال توليد keystore جديد سيُرفع كـ artifact لإضافته يدوياً مرّة واحدة."
          fi

      # ─────────────────────────────────────────────────────────────
      # 1) Compute version
      # ─────────────────────────────────────────────────────────────
      - name: 🔢 Compute version
        id: ver
        env:
          IN_VN: ${{ inputs.version_name }}
          IN_VC: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          CUR_VN=$(grep -oE 'APP_VERSION_NAME = "[^"]+"' capacitor.config.ts | sed -E 's/.*"([^"]+)".*/\1/')
          CUR_VC=$(grep -oE 'APP_VERSION_CODE = [0-9]+' capacitor.config.ts | grep -oE '[0-9]+')

          if [ -n "$IN_VN" ]; then
            VN="$IN_VN"
          else
            IFS=. read -r MA MI PA <<< "$CUR_VN"
            VN="${MA}.${MI}.$((PA+1))"
          fi

          if [ -n "$IN_VC" ]; then
            VC="$IN_VC"
          else
            VC=$((CUR_VC + 1))
          fi

          echo "version_name=$VN" >> $GITHUB_OUTPUT
          echo "version_code=$VC" >> $GITHUB_OUTPUT
          echo "tag_name=v${VN}+${VC}" >> $GITHUB_OUTPUT
          echo "── Building v${VN} (build ${VC}) ──"

      - name: ✏️ Apply version to source
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          sed -i -E "s/(APP_VERSION_NAME = )\"[^\"]+\"/\1\"${VN}\"/" capacitor.config.ts src/lib/appVersion.ts
          sed -i -E "s/(APP_VERSION_CODE = )[0-9]+/\1${VC}/"          capacitor.config.ts src/lib/appVersion.ts

      - name: 💾 Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capacitor.config.ts src/lib/appVersion.ts
          git diff --cached --quiet || {
            git commit -m "chore(release): v${{ steps.ver.outputs.version_name }} (build ${{ steps.ver.outputs.version_code }}) [skip ci]"
            git push
          }

      # ─────────────────────────────────────────────────────────────
      # 2) Toolchain
      # ─────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21" }
      - uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: "35.0.0"
          cmdline-tools-version: "11076708"

      - name: 📦 npm install
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps \
            || npm install --no-audit --no-fund --legacy-peer-deps

      - name: 🏗️ Web build
        env:
          CAP_ENV: production
          NODE_ENV: production
        run: npm run build

      - name: 📱 Capacitor sync
        env:
          CAP_ENV: production
        run: |
          [ -d "android" ] || npx cap add android
          npx cap sync android

      - name: 🔢 Patch Gradle version
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/"          android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VN\"/"  android/app/build.gradle

      # ─────────────────────────────────────────────────────────────
      # 3) Ensure permanent signing secrets (auto-generate + persist)
      # ─────────────────────────────────────────────────────────────
      - name: 🔐 Ensure permanent signing secrets
        env:
          GH_REPO_ADMIN_TOKEN: ${{ secrets.GH_REPO_ADMIN_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          SECRET_NAMES=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)

          present=0
          for s in "${SECRET_NAMES[@]}"; do
            [ -n "${!s:-}" ] && present=$((present+1))
          done

          mkdir -p out backup
          VALID=false
          if [ "$present" -eq 4 ]; then
            echo "Checking existing Android signing secrets consistency..."
            if echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > out/_check.keystore 2>/dev/null \
               && [ "$(stat -c%s out/_check.keystore 2>/dev/null || echo 0)" -ge 1000 ] \
               && keytool -list -keystore out/_check.keystore \
                    -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1 \
               && keytool -keypasswd -keystore out/_check.keystore \
                    -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                    -alias "$ANDROID_KEY_ALIAS" \
                    -keypass "$ANDROID_KEY_PASSWORD" \
                    -new "$ANDROID_KEY_PASSWORD" >/dev/null 2>&1; then
              VALID=true
            fi
            rm -f out/_check.keystore
          fi

          if [ "$VALID" = "true" ]; then
            echo "✓ Reusing existing permanent signing secrets (validated)"
            KS_B64="$ANDROID_KEYSTORE_BASE64"
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
            echo "::add-mask::$STORE_PASS"
            echo "::add-mask::$KEY_PASS"
            echo "::add-mask::$KS_B64"
            { echo "ANDROID_KEYSTORE_BASE64<<E"; echo "$KS_B64"; echo "E"; } >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$ALIAS"              >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"        >> $GITHUB_ENV
            echo "AUTO_GENERATED=false"                  >> $GITHUB_ENV
            echo "PERSISTED=true"                        >> $GITHUB_ENV
            exit 0
          else
            if [ "$present" -eq 4 ]; then
              echo "::warning::All Android signing secrets exist but are inconsistent/invalid. Generating a new keystore and replacing values for this run."
            else
              echo "::notice::Generating new release keystore ($((4-present))/4 secrets missing)"
            fi

            STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
            KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
            ALIAS=tipstricks
            keytool -genkeypair -v -keystore out/release.keystore -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Tips and Tricks, OU=Mobile, O=Lovable App, L=NA, ST=NA, C=US"
            KS_B64=$(base64 -w0 out/release.keystore)
          fi

          AUTO_GENERATED=true
          PERSISTED=false
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "::add-mask::$KS_B64"

          { echo "ANDROID_KEYSTORE_BASE64<<E"; echo "$KS_B64"; echo "E"; } >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$ALIAS"              >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=$KEY_PASS"        >> $GITHUB_ENV
          echo "AUTO_GENERATED=$AUTO_GENERATED"        >> $GITHUB_ENV

          if [ "$AUTO_GENERATED" = "true" ] && [ -f out/release.keystore ]; then
            cp out/release.keystore backup/release.keystore
          fi

          if [ -n "${GH_REPO_ADMIN_TOKEN:-}" ] && [ "$AUTO_GENERATED" = "true" ]; then
            echo "GH_REPO_ADMIN_TOKEN detected: attempting to persist generated secrets to repository."
            GH_READY=true

            if command -v gh >/dev/null 2>&1; then
              echo "gh CLI found."
            else
              echo "::notice::gh CLI not found; attempting installation..."
              if command -v apt-get >/dev/null 2>&1; then
                if ! (sudo apt-get update -y && sudo apt-get install -y gh) >out/gh-install.log 2>&1; then
                  GH_READY=false
                  echo "::warning::Failed to install gh CLI. Details:"
                  tail -n 40 out/gh-install.log || true
                fi
              else
                GH_READY=false
              fi
            fi

            if [ "$GH_READY" = "true" ] && ! command -v gh >/dev/null 2>&1; then
              GH_READY=false
            fi

            if [ "$GH_READY" = "true" ]; then
              gh --version || true
              AUTH_ERR=""
              if ! echo "$GH_REPO_ADMIN_TOKEN" | gh auth login --hostname github.com --with-token 2>out/gh-auth.err; then
                AUTH_ERR="$(cat out/gh-auth.err 2>/dev/null || true)"
                echo "::warning::gh auth login failed. Will fallback to GH_TOKEN for gh commands. ${AUTH_ERR}"
                export GH_TOKEN="$GH_REPO_ADMIN_TOKEN"
              fi

              if ! gh auth status --hostname github.com >/dev/null 2>&1; then
                export GH_TOKEN="$GH_REPO_ADMIN_TOKEN"
              fi
              gh auth status --hostname github.com || true

              if echo "$AUTH_ERR" | grep -Eqi '(401|403|forbidden|unauthorized|resource not accessible|http 4(01|03))'; then
                echo "::error::GH_REPO_ADMIN_TOKEN authentication is not authorized (401/403). Use a PAT with repo scope from an admin account, and confirm org policies allow secret management."
                exit 1
              fi

              set_secret_with_retry() {
                local secret_name="$1"
                local secret_value="$2"
                local attempt=1
                while [ "$attempt" -le 3 ]; do
                  if printf '%s' "$secret_value" | gh secret set "$secret_name" --repo "$GITHUB_REPOSITORY" --body - >out/gh-secret-set.log 2>&1; then
                    echo "✓ persisted $secret_name (attempt $attempt)"
                    return 0
                  fi
                  echo "::warning::Failed to persist $secret_name (attempt $attempt/3)."
                  tail -n 20 out/gh-secret-set.log || true
                  sleep $((attempt * 2))
                  attempt=$((attempt + 1))
                done
                return 1
              }

              OK=true
              set_secret_with_retry ANDROID_KEYSTORE_BASE64 "$KS_B64" || OK=false
              set_secret_with_retry ANDROID_KEYSTORE_PASSWORD "$STORE_PASS" || OK=false
              set_secret_with_retry ANDROID_KEY_ALIAS "$ALIAS" || OK=false
              set_secret_with_retry ANDROID_KEY_PASSWORD "$KEY_PASS" || OK=false

              SECRET_LIST="$(gh secret list --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)"
              for s in "${SECRET_NAMES[@]}"; do
                echo "$SECRET_LIST" | awk '{print $1}' | grep -Fqx "$s" || OK=false
              done

              if [ "$OK" = "true" ]; then
                PERSISTED=true
                echo "✅ All 4 signing secrets persisted permanently to repository."
              else
                PERSISTED=false
                echo "::warning::Generated keystore secrets could not be fully confirmed in repository secrets. Check PAT scope (repo), repository admin rights, and any organization secret policy restrictions."
              fi
            else
              PERSISTED=false
              echo "::warning::gh CLI is unavailable and installation failed; continuing with artifact backup only."
            fi
          elif [ -z "${GH_REPO_ADMIN_TOKEN:-}" ] && [ "$AUTO_GENERATED" = "true" ]; then
            PERSISTED=false
            echo "::notice::GH_REPO_ADMIN_TOKEN is not configured. Build continues and keystore backup artifact will be uploaded."
          fi

          echo "PERSISTED=$PERSISTED" >> $GITHUB_ENV

          cat > backup/SECRETS.txt <<EOF
          ⚠️ نسخة احتياطية — احفظها في خزنة آمنة (1Password / Bitwarden)
          ════════════════════════════════════════════════════
          ANDROID_KEYSTORE_PASSWORD = ${STORE_PASS}
          ANDROID_KEY_ALIAS         = ${ALIAS}
          ANDROID_KEY_PASSWORD      = ${KEY_PASS}
          ════════════════════════════════════════════════════
          PERSISTED to GitHub Secrets: ${PERSISTED}

          إن كانت PERSISTED=false، أضف الأسرار الأربعة يدوياً:
            Repo Settings → Secrets and variables → Actions → New repository secret
              ANDROID_KEYSTORE_BASE64   = (محتوى release.keystore بعد base64 -w0)
              ANDROID_KEYSTORE_PASSWORD = أعلاه
              ANDROID_KEY_ALIAS         = tipstricks
              ANDROID_KEY_PASSWORD      = أعلاه
          EOF

          {
            if [ "$PERSISTED" = "true" ]; then
              echo "## 🔐 Permanent signing secrets created"
              echo ""
              echo "تم توليد keystore جديد وحفظ الأسرار الأربعة دائماً في المستودع."
              echo "كل البناءات القادمة ستستخدم نفس التوقيع — جاهز لـ Google Play."
            else
              echo "## ⚠️ Keystore generated (NOT yet persisted as secrets)"
              echo ""
              echo "حمّل artifact \`keystore-backup-DOWNLOAD-AND-DELETE\` وأضف الأسرار الأربعة يدوياً في إعدادات المستودع لتثبيت التوقيع لكل البناءات القادمة."
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: 📦 Upload keystore backup (one-time)
        if: env.AUTO_GENERATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-DOWNLOAD-AND-DELETE
          path: backup/
          retention-days: 7

      # ─────────────────────────────────────────────────────────────
      # 4) Sign + build
      # ─────────────────────────────────────────────────────────────
      - name: 🔑 Decode keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          [ "$(stat -c%s android/app/release.keystore)" -ge 1000 ] || { echo "::error::Keystore too small"; exit 1; }

      - name: ✍️ Inject signing config
        run: |
          F=android/app/build.gradle
          grep -q "signingConfigs" "$F" && exit 0
          python3 - <<'PY'
          import re
          p="android/app/build.gradle"; c=open(p).read()
          sc='    signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword System.getenv("KS_PASS")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASS")\n        }\n    }\n'
          c,_=re.subn(r'(android\s*\{\r?\n)', r'\1'+sc, c, 1)
          c,_=re.subn(r'(buildTypes\s*\{\s*\r?\n\s*release\s*\{\s*\r?\n)', r'\1            signingConfig signingConfigs.release\n', c, 1)
          open(p,"w").write(c)
          PY

      - name: 🏗️ Build signed AAB
        env:
          KS_PASS: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 🏷️ Collect AAB
        id: collect
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          BASE="tipstricks-v${VN}-vc${VC}"
          mkdir -p dist-out
          cp android/app/build/outputs/bundle/release/app-release.aab "dist-out/${BASE}.aab"
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "aab=dist-out/${BASE}.aab" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────────────────────────
      # 5) Verify signature + Play compliance
      # ─────────────────────────────────────────────────────────────
      - name: 🔍 Verify AAB
        env:
          AAB: ${{ steps.collect.outputs.aab }}
        run: |
          set -euo pipefail
          jarsigner -verify -strict "$AAB" >/dev/null
          AAB_SHA=$(keytool -printcert -jarfile "$AAB" 2>/dev/null | awk '/SHA256:/ {print $2; exit}')
          KS_SHA=$(keytool -list -v -keystore android/app/release.keystore \
                    -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                    -alias "$ANDROID_KEY_ALIAS" 2>/dev/null \
                    | awk '/SHA256:/ {print $2; exit}')
          [ "$AAB_SHA" = "$KS_SHA" ] || { echo "::error::Signature mismatch"; exit 1; }
          echo "✅ AAB signed correctly (SHA256: $AAB_SHA)"

      - name: 📤 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.base }}
          path: dist-out/
          retention-days: 90

      # ─────────────────────────────────────────────────────────────
      # 6) GitHub Release (optional)
      # ─────────────────────────────────────────────────────────────
      - name: 🚀 GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: v${{ steps.ver.outputs.version_name }} (build ${{ steps.ver.outputs.version_code }})
          files: dist-out/*
          draft: false
          prerelease: false
