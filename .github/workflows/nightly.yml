name: Nightly Build

# ==============================================================================
# بناء يومي تلقائي من main كل ليلة 02:00 UTC.
# يُولّد AAB موقّع كـ pre-release باسم nightly-YYYYMMDD ويُحذف بعد 14 يوم.
# ==============================================================================

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  check_changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT; exit 0
          fi
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(git log --since="$SINCE" --oneline | wc -l)
          [ "$COUNT" -gt 0 ] && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT

  nightly:
    needs: check_changes
    if: needs.check_changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 🌙 Compute nightly version
        id: ver
        run: |
          BASE_VC=$(grep -oE 'APP_VERSION_CODE = [0-9]+' capacitor.config.ts | grep -oE '[0-9]+')
          BASE_VN=$(grep -oE 'APP_VERSION_NAME = "[^"]+"' capacitor.config.ts | sed -E 's/.*"([^"]+)".*/\1/')
          STAMP=$(date -u +'%Y%m%d')
          VC=$((BASE_VC * 10000 + GITHUB_RUN_NUMBER))
          VN="${BASE_VN}-nightly.${STAMP}"
          sed -i -E "s/(APP_VERSION_NAME = )\"[^\"]+\"/\1\"${VN}\"/" capacitor.config.ts src/lib/appVersion.ts
          sed -i -E "s/(APP_VERSION_CODE = )[0-9]+/\1${VC}/"          capacitor.config.ts src/lib/appVersion.ts
          echo "vn=$VN"   >> $GITHUB_OUTPUT
          echo "vc=$VC"   >> $GITHUB_OUTPUT
          echo "tag=nightly-${STAMP}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21" }
      - uses: android-actions/setup-android@v3
        with: { api-level: 35, build-tools: "35.0.0", cmdline-tools-version: "11076708" }

      - run: npm ci --no-audit --no-fund
      - run: NODE_ENV=production CAP_ENV=production npm run build
      - run: |
          [ -d "android" ] || npx cap add android
          CAP_ENV=production npx cap sync android
      - run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.ver.outputs.vc }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${{ steps.ver.outputs.vn }}\"/" android/app/build.gradle

      - name: 🔑 Decode keystore
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          [ -z "$KS" ] && { echo "::error::Run Release workflow first to generate keystore"; exit 1; }
          echo "$KS" | base64 -d > android/app/release.keystore

      - name: ✍️ Inject signing
        run: |
          F=android/app/build.gradle
          grep -q "signingConfigs" "$F" && exit 0
          python3 -c "
          import re
          p='$F'; c=open(p).read()
          sc='    signingConfigs {\n        release {\n            storeFile file(\"release.keystore\")\n            storePassword System.getenv(\"KS_PASS\")\n            keyAlias System.getenv(\"KEY_ALIAS\")\n            keyPassword System.getenv(\"KEY_PASS\")\n        }\n    }\n'
          c=re.sub(r'(android\s*\{\r?\n)', r'\1'+sc, c, 1)
          c=re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.release', c, 1)
          open(p,'w').write(c)
          "

      - name: 📦 Build AAB
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - name: 📤 Publish nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 🌙 Nightly ${{ steps.ver.outputs.vn }}
          body: |
            بناء ليلي تلقائي من فرع `main` — لأغراض الاختبار فقط.
            **versionCode:** ${{ steps.ver.outputs.vc }}
            **commit:** `${{ github.sha }}`
            ⚠️ سيُحذف هذا الإصدار بعد 14 يوم.
          files: android/app/build/outputs/bundle/release/app-release.aab
          prerelease: true

  cleanup:
    needs: nightly
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: 🗑️ Delete nightlies older than 14 days
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          CUTOFF=$(date -u -d '14 days ago' +%s)
          gh release list --limit 100 --json tagName,publishedAt,isPrerelease | \
            jq -r '.[] | select(.isPrerelease and (.tagName|startswith("nightly-"))) | [.tagName, .publishedAt] | @tsv' | \
            while IFS=$'\t' read -r tag date; do
              ts=$(date -d "$date" +%s)
              if [ "$ts" -lt "$CUTOFF" ]; then
                echo "Deleting $tag"; gh release delete "$tag" --yes --cleanup-tag || true
              fi
            done
