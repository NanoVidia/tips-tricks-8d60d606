name: Keystore Management

# ==============================================================================
# إدارة keystore بثلاثة أوضاع — generate / import / verify.
# يستبدل generate-keystore.yml و import-keystore.yml.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "العملية المطلوبة (افتراضياً generate لأول إعداد)"
        required: true
        type: choice
        default: generate
        options: [verify, generate, import]
      keystore_base64:
        description: "(import فقط) محتوى base64 للـ release.keystore"
        required: false
        default: ""
      keystore_password:
        description: "(import فقط) store password"
        required: false
        default: ""
      key_alias:
        description: "(import فقط) alias name"
        required: false
        default: ""
      key_password:
        description: "(import فقط) key password"
        required: false
        default: ""

permissions:
  contents: read
  actions: write
  secrets: write

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21" }

      # ─────────── VERIFY ───────────
      - name: 🔎 Verify existing secrets
        if: inputs.mode == 'verify'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS PW AL KP; do
            [ -z "${!v}" ] && { echo "::error::Missing secret for $v"; exit 1; }
          done
          echo "$KS" | base64 -d > /tmp/ks
          SIZE=$(stat -c%s /tmp/ks)
          [ "$SIZE" -ge 1000 ] || { echo "::error::Keystore too small ($SIZE bytes)"; exit 1; }
          keytool -list -keystore /tmp/ks -storepass "$PW" -alias "$AL" -v 2>/dev/null | \
            grep -E "Alias|Owner|SHA1|SHA256|Valid" | tee /tmp/info.txt
          {
            echo "## ✅ Keystore valid"
            echo ""
            echo "- Size: \`$SIZE\` bytes"
            echo "- Alias: \`$AL\`"
            echo ""
            echo '```'
            cat /tmp/info.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # ─────────── GENERATE ───────────
      - name: 🆕 Generate new keystore
        if: inputs.mode == 'generate'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          # Refuse if any secret already exists
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if gh secret list | grep -q "^$s\b"; then
              echo "::error::Secret $s already exists. Use 'verify' to inspect, or delete it manually first."
              exit 1
            fi
          done
          STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          ALIAS=tipstricks
          mkdir -p out
          keytool -genkeypair -v -keystore out/release.keystore -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Tips and Tricks, OU=Mobile, O=Lovable App, L=NA, ST=NA, C=US"
          KS_B64=$(base64 -w0 out/release.keystore)
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "::add-mask::$KS_B64"
          echo "$KS_B64"     | gh secret set ANDROID_KEYSTORE_BASE64    --body -
          echo "$STORE_PASS" | gh secret set ANDROID_KEYSTORE_PASSWORD  --body -
          echo "$ALIAS"      | gh secret set ANDROID_KEY_ALIAS          --body -
          echo "$KEY_PASS"   | gh secret set ANDROID_KEY_PASSWORD       --body -
          echo "$KS_B64" > out/ANDROID_KEYSTORE_BASE64.txt
          cat > out/SECRETS.txt <<EOF
          ANDROID_KEYSTORE_PASSWORD = ${STORE_PASS}
          ANDROID_KEY_ALIAS         = ${ALIAS}
          ANDROID_KEY_PASSWORD      = ${KEY_PASS}
          EOF

      - name: 📦 Upload keystore backup
        if: inputs.mode == 'generate'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-DOWNLOAD-AND-DELETE
          path: out/
          retention-days: 7

      # ─────────── IMPORT ───────────
      - name: 📥 Import existing keystore
        if: inputs.mode == 'import'
        env:
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ inputs.keystore_base64 }}
          PW: ${{ inputs.keystore_password }}
          AL: ${{ inputs.key_alias }}
          KP: ${{ inputs.key_password }}
        run: |
          for v in KS_B64 PW AL KP; do
            [ -z "${!v}" ] && { echo "::error::Missing input $v"; exit 1; }
          done
          echo "$KS_B64" | base64 -d > /tmp/ks
          keytool -list -keystore /tmp/ks -storepass "$PW" -alias "$AL" >/dev/null \
            || { echo "::error::Validation failed — check password/alias"; exit 1; }
          echo "::add-mask::$KS_B64"
          echo "::add-mask::$PW"
          echo "::add-mask::$KP"
          echo "$KS_B64" | gh secret set ANDROID_KEYSTORE_BASE64    --body -
          echo "$PW"     | gh secret set ANDROID_KEYSTORE_PASSWORD  --body -
          echo "$AL"     | gh secret set ANDROID_KEY_ALIAS          --body -
          echo "$KP"     | gh secret set ANDROID_KEY_PASSWORD       --body -
          echo "✅ All 4 secrets imported successfully"
