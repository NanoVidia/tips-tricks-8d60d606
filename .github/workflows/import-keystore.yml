name: Import Existing Android Keystore

# ==============================================================================
# يستورد keystore موجود مسبقاً ويرفعه إلى Secrets في المستودع تلقائياً.
# استخدمه عند نقل التطبيق إلى مستودع جديد بدل توليد keystore جديد
# (لأن Google Play لا يقبل تحديث التطبيق بـ keystore مختلف عن الأصلي).
#
# طريقة الاستخدام:
#   1. حوّل ملف keystore إلى Base64 على جهازك:
#        macOS / Linux:  base64 -i release.keystore | tr -d '\n' | pbcopy
#        Linux:          base64 -w0 release.keystore | xclip -selection clipboard
#        Windows PS:     [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.keystore")) | Set-Clipboard
#
#   2. افتح Actions → "Import Existing Android Keystore" → Run workflow
#   3. الصق محتوى Base64 + كلمات المرور + الـ alias
#   4. اضغط Run — سيتم رفع الأسرار الأربعة تلقائياً إلى المستودع
#
# ⚠️  القيم المُدخلة مُقنّعة في السجلات (logs) ولن تظهر للعلن.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      keystore_base64:
        description: "محتوى ملف keystore بصيغة Base64 (سطر واحد بدون مسافات)"
        required: true
      keystore_password:
        description: "كلمة مرور الـ keystore (storepass)"
        required: true
      key_alias:
        description: "اسم الـ alias داخل الـ keystore"
        required: true
        default: "tipstricks"
      key_password:
        description: "كلمة مرور المفتاح (keypass) — اتركها فارغة لاستخدام نفس كلمة الـ keystore"
        required: false
        default: ""
      overwrite_existing:
        description: "السماح بالكتابة فوق الأسرار الموجودة"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🛡️ Mask sensitive inputs
        env:
          KS_B64: ${{ inputs.keystore_base64 }}
          KS_PASS: ${{ inputs.keystore_password }}
          KEY_PASS: ${{ inputs.key_password }}
        run: |
          echo "::add-mask::$KS_B64"
          echo "::add-mask::$KS_PASS"
          [ -n "$KEY_PASS" ] && echo "::add-mask::$KEY_PASS" || true
          echo "Inputs masked."

      - name: 🚦 Guard against accidental overwrite
        if: ${{ !inputs.overwrite_existing }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh secret list --json name --jq '.[].name' | grep -qx "ANDROID_KEYSTORE_BASE64"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 already exists in this repo."
            echo "::error::If you really want to replace it, re-run with overwrite_existing=true."
            exit 1
          fi

      - name: ☕ Setup Java 17 (for keytool validation)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🧪 Decode & validate keystore
        env:
          KS_B64: ${{ inputs.keystore_base64 }}
          KS_PASS: ${{ inputs.keystore_password }}
          ALIAS: ${{ inputs.key_alias }}
        run: |
          set -euo pipefail
          mkdir -p out
          # نظّف أي مسافات/أسطر جديدة قد تكون نُسخت بالخطأ
          printf '%s' "$KS_B64" | tr -d '[:space:]' > out/keystore.b64.txt

          if ! base64 -d out/keystore.b64.txt > out/release.keystore 2>/dev/null; then
            echo "::error::Invalid Base64 content. Re-encode the keystore with 'base64 -w0'."
            exit 1
          fi

          SIZE=$(stat -c%s out/release.keystore)
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Decoded keystore too small ($SIZE bytes) — likely corrupt or wrong file."
            exit 1
          fi
          echo "Decoded keystore size: $SIZE bytes"

          if ! keytool -list -keystore out/release.keystore -storepass "$KS_PASS" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::keytool validation failed."
            echo "::error::Check that keystore_password and key_alias match this keystore."
            echo "── Available aliases in this keystore ──"
            keytool -list -keystore out/release.keystore -storepass "$KS_PASS" 2>/dev/null | grep -i "alias" || true
            exit 1
          fi

          echo "── Certificate fingerprint (SHA-256) ──"
          keytool -list -v -keystore out/release.keystore -storepass "$KS_PASS" -alias "$ALIAS" 2>/dev/null \
            | grep -E "SHA(1|256):|Owner:|Valid from:" || true
          echo "Keystore validated successfully."

      - name: 📤 Upload secrets to repository
        env:
          GH_TOKEN: ${{ github.token }}
          KS_PASS: ${{ inputs.keystore_password }}
          KEY_PASS: ${{ inputs.key_password }}
          ALIAS: ${{ inputs.key_alias }}
        run: |
          set -euo pipefail
          KS_B64_CLEAN=$(cat out/keystore.b64.txt)
          echo "::add-mask::$KS_B64_CLEAN"

          # إذا لم تُدخل كلمة مرور للمفتاح، نستخدم كلمة مرور الـ keystore
          EFFECTIVE_KEY_PASS="${KEY_PASS:-$KS_PASS}"
          echo "::add-mask::$EFFECTIVE_KEY_PASS"

          echo "$KS_B64_CLEAN"        | gh secret set ANDROID_KEYSTORE_BASE64   --body -
          echo "$KS_PASS"              | gh secret set ANDROID_KEYSTORE_PASSWORD --body -
          echo "$ALIAS"                | gh secret set ANDROID_KEY_ALIAS         --body -
          echo "$EFFECTIVE_KEY_PASS"   | gh secret set ANDROID_KEY_PASSWORD      --body -

          echo "All four Android signing secrets uploaded."

      - name: 📋 Summary
        run: |
          {
            echo "## Keystore imported successfully"
            echo ""
            echo "Uploaded the following repository secrets:"
            echo "- \`ANDROID_KEYSTORE_BASE64\`"
            echo "- \`ANDROID_KEYSTORE_PASSWORD\`"
            echo "- \`ANDROID_KEY_ALIAS\`"
            echo "- \`ANDROID_KEY_PASSWORD\`"
            echo ""
            echo "You can now run **Build Android AAB** or **Release Android AAB**."
          } >> $GITHUB_STEP_SUMMARY
