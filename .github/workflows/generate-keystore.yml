name: Setup Android Signing Secrets (one-time)

# ==============================================================================
# يقوم هذا الـ workflow بتوليد ملف keystore جديد على GitHub مباشرةً
# بدون الحاجة لتثبيت Java أو أي شيء على جهازك.
#
# طريقة الاستخدام (مرة واحدة فقط في عمر التطبيق):
#   1. افتح تبويب Actions في مستودع GitHub.
#   2. اختر "Generate Android Keystore (one-time)" من القائمة اليسرى.
#   3. اضغط "Run workflow" (أعلى اليمين).
#   4. انتظر ~30 ثانية حتى ينتهي.
#   5. افتح الـ run الذي اكتمل، ثم اضغط على "Summary".
#   6. حمّل الـ Artifact المسمى "keystore-bundle" (ملف ZIP).
#   7. داخل الـ ZIP ستجد:
#        - release.keystore        ← احفظه في مكان آمن للأبد (Google Drive مشفر)
#        - keystore.b64.txt        ← انسخ محتواه كاملاً
#        - SECRETS.txt             ← يحتوي القيم التي ستضعها في Secrets
#
#   8. اذهب إلى: Settings → Secrets and variables → Actions → New repository secret
#      وأضف الأربع secrets التالية (القيم موجودة في SECRETS.txt):
#        - ANDROID_KEYSTORE_BASE64   ← محتوى keystore.b64.txt كاملاً
#        - ANDROID_KEYSTORE_PASSWORD
#        - ANDROID_KEY_ALIAS
#        - ANDROID_KEY_PASSWORD
#
#   9. بعد إضافتها، شغّل workflow الثاني "Build Android AAB" للحصول على ملف AAB موقّع.
#
# ⚠️  تحذير: لا تُشغّل هذا الـ workflow أكثر من مرة! إذا أنشأت keystore جديداً
#    بعد رفع التطبيق على Google Play، لن تستطيع تحديث التطبيق أبداً.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "⚠️ تشغيل إجباري حتى لو كانت الأسرار موجودة (غير مستحسن)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🧪 Prevent accidental re-run (one-time guard)
        if: ${{ !inputs.force_regenerate }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh secret list --json name --jq '.[].name' | grep -qx "ANDROID_KEYSTORE_BASE64"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 already exists. This workflow is one-time only."
            echo "::error::If you really must regenerate, run again with force_regenerate=true."
            exit 1
          fi

      - name: 🔐 Generate random secure passwords
        id: pwd
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_OUTPUT
          echo "KEY_PASS=$KEY_PASS" >> $GITHUB_OUTPUT

      - name: 🏗️ Generate keystore
        env:
          STORE_PASS: ${{ steps.pwd.outputs.STORE_PASS }}
          KEY_PASS: ${{ steps.pwd.outputs.KEY_PASS }}
          ALIAS: tipstricks
          VALIDITY: 30
        run: |
          set -euo pipefail
          mkdir -p out
          DAYS=$(( VALIDITY * 365 ))
          keytool -genkeypair -v \
            -keystore out/release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity $DAYS \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Tips and Tricks, OU=Mobile, O=Lovable App, L=NA, ST=NA, C=US"

          keytool -list -keystore out/release.keystore -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null
          MIN_KEYSTORE_SIZE_BYTES=1000
          SIZE=$(stat -c%s out/release.keystore)
          if [ "$SIZE" -lt "$MIN_KEYSTORE_SIZE_BYTES" ]; then
            echo "::error::Generated keystore size is too small ($SIZE bytes)"
            exit 1
          fi

          base64 -w0 out/release.keystore > out/keystore.b64.txt
          echo "✅ Keystore generated and validated ($SIZE bytes)"

      - name: 📤 Upload signing secrets automatically
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_PASS: ${{ steps.pwd.outputs.STORE_PASS }}
          KEY_PASS: ${{ steps.pwd.outputs.KEY_PASS }}
        run: |
          set -euo pipefail
          KS_B64=$(cat out/keystore.b64.txt)
          echo "::add-mask::$KS_B64"
          echo "$KS_B64" | gh secret set ANDROID_KEYSTORE_BASE64 --body -
          echo "$STORE_PASS" | gh secret set ANDROID_KEYSTORE_PASSWORD --body -
          echo "tipstricks" | gh secret set ANDROID_KEY_ALIAS --body -
          echo "$KEY_PASS" | gh secret set ANDROID_KEY_PASSWORD --body -
          echo "✅ All Android signing secrets uploaded automatically."

      - name: 💾 Prepare backup bundle (keystore + secrets)
        env:
          STORE_PASS: ${{ steps.pwd.outputs.STORE_PASS }}
          KEY_PASS: ${{ steps.pwd.outputs.KEY_PASS }}
        run: |
          set -euo pipefail
          mkdir -p backup
          cp out/release.keystore  backup/release.keystore
          cp out/keystore.b64.txt  backup/ANDROID_KEYSTORE_BASE64.txt
          cat > backup/SECRETS.txt <<EOF
          ════════════════════════════════════════════════════════════════
          🔐 Android Signing Secrets — BACKUP (KEEP SAFE FOREVER)
          ════════════════════════════════════════════════════════════════
          Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          Repository: ${GITHUB_REPOSITORY}

          ⚠️  هذه القيم مرفوعة بالفعل إلى GitHub Secrets.
          ⚠️  هذه نسخة احتياطية في حال فقدان الوصول للمستودع.
          ⚠️  احفظها في مكان آمن (1Password / Google Drive مشفّر) ثم احذف الـ artifact.

          ─── الأسرار الأربعة ───
          ANDROID_KEYSTORE_BASE64   = (محتوى ملف ANDROID_KEYSTORE_BASE64.txt)
          ANDROID_KEYSTORE_PASSWORD = ${STORE_PASS}
          ANDROID_KEY_ALIAS         = tipstricks
          ANDROID_KEY_PASSWORD      = ${KEY_PASS}

          ─── ملفات النسخة الاحتياطية ───
          - release.keystore                ← الملف الأصلي (احفظه!)
          - ANDROID_KEYSTORE_BASE64.txt     ← نسخة Base64 سطر واحد
          - SECRETS.txt                     ← هذا الملف

          ─── خطوات الاستعادة لاحقاً ───
          1. ارفع release.keystore إلى مستودع جديد عبر workflow:
             "Import Existing Android Keystore"
          2. أو أعِد إدخال الأسرار يدوياً في:
             Settings → Secrets and variables → Actions

          ⚠️  بدون هذه الملفات لن تستطيع تحديث التطبيق على Google Play أبداً.
          ════════════════════════════════════════════════════════════════
          EOF
          chmod -R go-rwx backup
          ls -la backup/

      - name: 📦 Upload backup artifact (download & delete immediately!)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-DOWNLOAD-AND-DELETE
          path: backup/
          retention-days: 7
          if-no-files-found: error

      - name: 📋 Summary
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "## ✅ Android signing secrets created & uploaded"
            echo ""
            echo "### 🔐 Secrets uploaded to GitHub"
            echo "- \`ANDROID_KEYSTORE_BASE64\`"
            echo "- \`ANDROID_KEYSTORE_PASSWORD\`"
            echo "- \`ANDROID_KEY_ALIAS\` = \`tipstricks\`"
            echo "- \`ANDROID_KEY_PASSWORD\`"
            echo ""
            echo "## 🚨 خطوة إلزامية الآن — نسخة احتياطية"
            echo ""
            echo "### ⬇️ نزّل الـ artifact فوراً:"
            echo "**[keystore-backup-DOWNLOAD-AND-DELETE](${REPO_URL}/actions/runs/${GITHUB_RUN_ID})**"
            echo "(انزل لأسفل صفحة الـ run → قسم Artifacts)"
            echo ""
            echo "### 📦 محتوى النسخة الاحتياطية:"
            echo "| ملف | الوصف |"
            echo "|---|---|"
            echo "| \`release.keystore\` | المفتاح الأصلي — احفظه للأبد |"
            echo "| \`ANDROID_KEYSTORE_BASE64.txt\` | نسخة Base64 جاهزة للصق |"
            echo "| \`SECRETS.txt\` | كلمات المرور الأربعة + تعليمات |"
            echo ""
            echo "### 🛡️ خطوات الحفظ الآمن"
            echo "1. **نزّل** الـ artifact الآن (متاح 7 أيام فقط)."
            echo "2. **احفظ** الملفات في **1Password** أو **Google Drive مشفّر** أو خزنة بنكية رقمية."
            echo "3. **احذف** الـ artifact من GitHub بعد التنزيل: [إدارة Artifacts](${REPO_URL}/actions/runs/${GITHUB_RUN_ID})"
            echo "4. **فعّل Play App Signing** عند أول رفع لـ Google Play (نسخة إضافية لدى Google)."
            echo ""
            echo "### ⚠️ تحذير حرج"
            echo "- بدون هذه النسخة الاحتياطية + بدون Play App Signing → فقدان وصول GitHub = **استحالة تحديث التطبيق على Google Play للأبد**."
            echo "- لا تُشغّل هذا الـ workflow مرة أخرى — keystore واحد فقط لعمر التطبيق."
            echo "- لا ترفع هذه الملفات إلى Git أو Drive عام أو بريد إلكتروني."
          } >> $GITHUB_STEP_SUMMARY
