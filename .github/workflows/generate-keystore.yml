name: Generate Android Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "كلمة مرور الـ keystore (احفظها!)"
        required: true
      key_password:
        description: "كلمة مرور الـ key (نفس الأولى للتسهيل)"
        required: true
      key_alias:
        description: "Alias"
        required: true
        default: "tips-tricks"
      common_name:
        description: "الاسم (CN) — مثل: Tips Tricks"
        required: true
        default: "Tips Tricks"
      org:
        description: "المؤسسة (O)"
        required: true
        default: "Tips Tricks"
      country:
        description: "كود الدولة (C) — حرفان"
        required: true
        default: "SA"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=${{ github.event.inputs.common_name }}, O=${{ github.event.inputs.org }}, C=${{ github.event.inputs.country }}"

      - name: Encode to Base64
        run: base64 -w0 release.keystore > keystore.base64.txt

      - name: Upload keystore artifact (احفظه فوراً!)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-SAVE-THIS
          path: |
            release.keystore
            keystore.base64.txt
          retention-days: 7

      - name: Print instructions
        run: |
          echo "::notice::✅ تم التوليد. حمّل الـ artifact وأضف الأسرار التالية في GitHub Secrets:"
          echo "::notice::ANDROID_KEYSTORE_BASE64  ← محتوى keystore.base64.txt"
          echo "::notice::ANDROID_KEYSTORE_PASSWORD ← كلمة مرور الـ keystore"
          echo "::notice::ANDROID_KEY_ALIAS         ← ${{ github.event.inputs.key_alias }}"
          echo "::notice::ANDROID_KEY_PASSWORD      ← كلمة مرور الـ key"
