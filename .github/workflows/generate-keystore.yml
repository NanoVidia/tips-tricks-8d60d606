name: Generate Android Keystore (one-time)

# ==============================================================================
# يقوم هذا الـ workflow بتوليد ملف keystore جديد على GitHub مباشرةً
# بدون الحاجة لتثبيت Java أو أي شيء على جهازك.
#
# طريقة الاستخدام (مرة واحدة فقط في عمر التطبيق):
#   1. افتح تبويب Actions في مستودع GitHub.
#   2. اختر "Generate Android Keystore (one-time)" من القائمة اليسرى.
#   3. اضغط "Run workflow" (أعلى اليمين).
#   4. انتظر ~30 ثانية حتى ينتهي.
#   5. افتح الـ run الذي اكتمل، ثم اضغط على "Summary".
#   6. حمّل الـ Artifact المسمى "keystore-bundle" (ملف ZIP).
#   7. داخل الـ ZIP ستجد:
#        - release.keystore        ← احفظه في مكان آمن للأبد (Google Drive مشفر)
#        - keystore.b64.txt        ← انسخ محتواه كاملاً
#        - SECRETS.txt             ← يحتوي القيم التي ستضعها في Secrets
#
#   8. اذهب إلى: Settings → Secrets and variables → Actions → New repository secret
#      وأضف الأربع secrets التالية (القيم موجودة في SECRETS.txt):
#        - ANDROID_KEYSTORE_BASE64   ← محتوى keystore.b64.txt كاملاً
#        - ANDROID_KEYSTORE_PASSWORD
#        - ANDROID_KEY_ALIAS
#        - ANDROID_KEY_PASSWORD
#
#   9. بعد إضافتها، شغّل workflow الثاني "Build Android AAB" للحصول على ملف AAB موقّع.
#
# ⚠️  تحذير: لا تُشغّل هذا الـ workflow أكثر من مرة! إذا أنشأت keystore جديداً
#    بعد رفع التطبيق على Google Play، لن تستطيع تحديث التطبيق أبداً.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "اسم الـ alias (مثال: tipstricks)"
        required: true
        default: "tipstricks"
      validity_years:
        description: "عدد سنوات صلاحية المفتاح"
        required: true
        default: "30"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🔐 Generate random secure passwords
        id: pwd
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_OUTPUT
          echo "KEY_PASS=$KEY_PASS" >> $GITHUB_OUTPUT

      - name: 🏗️ Generate keystore
        env:
          STORE_PASS: ${{ steps.pwd.outputs.STORE_PASS }}
          KEY_PASS: ${{ steps.pwd.outputs.KEY_PASS }}
          ALIAS: ${{ inputs.key_alias }}
          VALIDITY: ${{ inputs.validity_years }}
        run: |
          mkdir -p out
          DAYS=$(( VALIDITY * 365 ))
          keytool -genkeypair -v \
            -keystore out/release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity $DAYS \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Tips and Tricks, OU=Mobile, O=Lovable App, L=NA, ST=NA, C=US"

          base64 -w0 out/release.keystore > out/keystore.b64.txt

          cat > out/SECRETS.txt <<EOF
          ============================================================
          🔐 GitHub Secrets — انسخ هذه القيم وأضفها في:
             Settings → Secrets and variables → Actions → New repository secret
          ============================================================

          1) ANDROID_KEYSTORE_BASE64
             القيمة: محتوى ملف keystore.b64.txt كاملاً (سطر واحد طويل)

          2) ANDROID_KEYSTORE_PASSWORD
             القيمة: $STORE_PASS

          3) ANDROID_KEY_ALIAS
             القيمة: $ALIAS

          4) ANDROID_KEY_PASSWORD
             القيمة: $KEY_PASS

          ============================================================
          ⚠️  مهم جداً:
          - احفظ ملف release.keystore في مكان آمن (Google Drive مشفر).
            إذا فقدته، لن تستطيع تحديث التطبيق على Google Play أبداً.
          - لا تُشارك هذه القيم مع أحد.
          - بعد إضافة الـ Secrets الأربعة، احذف هذا الـ Artifact من GitHub.
          ============================================================
          EOF

          echo "✅ تم توليد الـ keystore بنجاح"
          ls -la out/

      - name: 📤 Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: out/
          retention-days: 7

      - name: 📋 Summary
        run: |
          echo "## ✅ تم توليد الـ Keystore بنجاح" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### الخطوات التالية:" >> $GITHUB_STEP_SUMMARY
          echo "1. حمّل **keystore-bundle** من قسم Artifacts بالأعلى" >> $GITHUB_STEP_SUMMARY
          echo "2. افتح ملف \`SECRETS.txt\` داخل الـ ZIP" >> $GITHUB_STEP_SUMMARY
          echo "3. أضف الـ 4 secrets في: **Settings → Secrets and variables → Actions**" >> $GITHUB_STEP_SUMMARY
          echo "4. احفظ \`release.keystore\` في مكان آمن للأبد" >> $GITHUB_STEP_SUMMARY
          echo "5. شغّل workflow **Build Android AAB**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ لا تُشغّل هذا الـ workflow مرة أخرى — keystore واحد فقط لعمر التطبيق." >> $GITHUB_STEP_SUMMARY
