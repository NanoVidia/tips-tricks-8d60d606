name: Release Android AAB

# ==============================================================================
# Workflow مخصّص للإصدارات الرسمية (Releases).
#
# يقوم بـ:
#   1. بناء AAB موقّع باستخدام نفس الـ keystore secrets
#   2. تضمين رقم الإصدار (versionName + versionCode) واسم الفرع في اسم الملف
#   3. التحقق من التوقيع
#   4. رفع AAB كـ artifact
#   5. (اختياري) إنشاء GitHub Release مع AAB مرفق
#   6. (اختياري) رفع تلقائي إلى Google Play Internal Testing
#
# طرق التشغيل:
#   • يدوياً: Actions → "Release Android AAB" → Run workflow
#       اختر: track (internal/alpha/beta/production) و create_github_release
#   • تلقائياً: عند دفع tag بصيغة v1.1.0
#       git tag v1.1.0 && git push origin v1.1.0
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      track:
        description: "مسار النشر على Google Play"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - internal
          - alpha
          - beta
          - production
      create_github_release:
        description: "إنشاء GitHub Release مع AAB مرفق"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # لإنشاء GitHub Releases

    steps:
      # ------------------------------------------------------------------
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # لنحصل على tags و commit history

      # ------------------------------------------------------------------
      - name: 🏷️ Extract version & branch metadata
        id: meta
        run: |
          VERSION_NAME=$(grep -oE 'APP_VERSION_NAME = "[^"]+"' capacitor.config.ts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -oE 'APP_VERSION_CODE = [0-9]+' capacitor.config.ts | grep -oE '[0-9]+')
          BRANCH="${GITHUB_REF_NAME}"
          # تنظيف اسم الفرع للاستخدام في اسم ملف
          BRANCH_SAFE=$(echo "$BRANCH" | tr '/' '-' | tr -cd '[:alnum:]._-')
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y%m%d-%H%M')

          ARTIFACT_NAME="tipstricks-v${VERSION_NAME}-vc${VERSION_CODE}-${BRANCH_SAFE}-${SHORT_SHA}"
          AAB_FILENAME="${ARTIFACT_NAME}.aab"
          TAG_NAME="v${VERSION_NAME}+${VERSION_CODE}"

          echo "version_name=$VERSION_NAME"   >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE"   >> $GITHUB_OUTPUT
          echo "branch=$BRANCH"               >> $GITHUB_OUTPUT
          echo "branch_safe=$BRANCH_SAFE"     >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA"         >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE"       >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "aab_filename=$AAB_FILENAME"   >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME"           >> $GITHUB_OUTPUT

          echo "── Release metadata ──"
          echo "  versionName : $VERSION_NAME"
          echo "  versionCode : $VERSION_CODE"
          echo "  branch      : $BRANCH"
          echo "  commit      : $SHORT_SHA"
          echo "  artifact    : $AAB_FILENAME"

      # ------------------------------------------------------------------
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: "34.0.0"

      # ------------------------------------------------------------------
      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🏗️ Build web app (production)
        env:
          CAP_ENV: production
        run: npm run build

      - name: 📱 Add Android platform & sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🎨 Generate Android icons & splash
        run: |
          if [ -f "resources/icon.png" ] && [ -f "resources/splash.png" ]; then
            npx --yes @capacitor/assets generate --android || true
          fi

      # ------------------------------------------------------------------
      - name: 🔢 Patch versionCode / versionName into build.gradle
        env:
          VN: ${{ steps.meta.outputs.version_name }}
          VC: ${{ steps.meta.outputs.version_code }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VN\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # ------------------------------------------------------------------
      - name: 🔐 Ensure required Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          add_perm() {
            local p="$1"
            if ! grep -q "$p" "$MANIFEST"; then
              sed -i "s|<application|<uses-permission android:name=\"$p\" />\n    <application|" "$MANIFEST"
            fi
          }
          add_perm "android.permission.INTERNET"
          add_perm "android.permission.POST_NOTIFICATIONS"
          add_perm "com.android.vending.BILLING"

      # ------------------------------------------------------------------
      - name: 🔑 Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: ✍️ Inject signing config
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if ! grep -q "signingConfigs" "$GRADLE_FILE"; then
            python3 - <<'PY'
import re
path = "android/app/build.gradle"
content = open(path).read()
signing_block = '''    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KS_PASS")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASS")
        }
    }
'''
content = re.sub(r'(android\s*\{\s*\n)', r'\1' + signing_block, content, count=1)
content = re.sub(
    r'(buildTypes\s*\{\s*release\s*\{\s*\n)',
    r'\1            signingConfig signingConfigs.release\n',
    content, count=1,
)
open(path, "w").write(content)
PY
          fi

      # ------------------------------------------------------------------
      - name: 📦 Build signed AAB
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      # ------------------------------------------------------------------
      - name: 🏷️ Rename AAB with version + branch
        id: rename
        env:
          AAB_FILENAME: ${{ steps.meta.outputs.aab_filename }}
        run: |
          SRC="android/app/build/outputs/bundle/release/app-release.aab"
          mkdir -p release-output
          DEST="release-output/${AAB_FILENAME}"
          cp "$SRC" "$DEST"
          echo "aab_path=$DEST" >> $GITHUB_OUTPUT
          ls -la release-output/

      # ------------------------------------------------------------------
      - name: 🔍 Verify AAB is signed
        env:
          AAB: ${{ steps.rename.outputs.aab_path }}
        run: |
          SIZE=$(stat -c%s "$AAB")
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::AAB suspiciously small ($SIZE bytes)"
            exit 1
          fi
          if ! unzip -l "$AAB" | grep -E "META-INF/.*\.(RSA|EC|DSA)" ; then
            echo "::error::AAB is NOT signed"
            exit 1
          fi
          if ! jarsigner -verify -strict "$AAB" > /tmp/jarsigner.log 2>&1 ; then
            echo "::error::jarsigner verification failed"
            cat /tmp/jarsigner.log
            exit 1
          fi
          echo "── Certificate fingerprint ──"
          keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -E "SHA(1|256):" || true
          echo "✅ AAB signed & verified ($SIZE bytes)"

      # ------------------------------------------------------------------
      - name: 📤 Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.rename.outputs.aab_path }}
          retention-days: 90
          if-no-files-found: error

      # ------------------------------------------------------------------
      - name: 📝 Generate release notes
        id: notes
        env:
          VN: ${{ steps.meta.outputs.version_name }}
          VC: ${{ steps.meta.outputs.version_code }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          SHA: ${{ steps.meta.outputs.short_sha }}
          DATE: ${{ steps.meta.outputs.build_date }}
        run: |
          {
            echo "### Tips & Tricks — v${VN} (build ${VC})"
            echo ""
            echo "- **Branch:** \`${BRANCH}\`"
            echo "- **Commit:** \`${SHA}\`"
            echo "- **Built:** ${DATE} UTC"
            echo ""
            echo "#### Recent changes"
            git log -10 --pretty="- %s (%h)" || true
          } > release-notes.md
          cat release-notes.md

      # ------------------------------------------------------------------
      - name: 🚀 Create GitHub Release
        if: ${{ github.event_name == 'push' || inputs.create_github_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "v${{ steps.meta.outputs.version_name }} (build ${{ steps.meta.outputs.version_code }})"
          body_path: release-notes.md
          files: ${{ steps.rename.outputs.aab_path }}
          draft: false
          prerelease: false

      # ------------------------------------------------------------------
      - name: ☁️ Upload to Google Play (optional)
        if: ${{ inputs.track != 'none' && inputs.track != '' }}
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::warning::Skipping Play upload — secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set."
            echo "Add it in: Settings → Secrets and variables → Actions"
            exit 0
          fi
          echo "$PLAY_JSON" > /tmp/play-sa.json
          echo "Will upload to Play track: ${{ inputs.track }}"
        # ملاحظة: الرفع الفعلي يتم في الخطوة التالية بـ action متخصّص

      - name: ☁️ Publish to Google Play
        if: ${{ inputs.track != 'none' && inputs.track != '' && env.PLAY_JSON_PRESENT == 'true' }}
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_JSON_PRESENT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.lovable.tipstricks
          releaseFiles: ${{ steps.rename.outputs.aab_path }}
          track: ${{ inputs.track }}
          status: draft
          whatsNewDirectory: ""
          mappingFile: ""

      # ------------------------------------------------------------------
      - name: ✅ Summary
        env:
          VN: ${{ steps.meta.outputs.version_name }}
          VC: ${{ steps.meta.outputs.version_code }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          AAB: ${{ steps.meta.outputs.aab_filename }}
          TRACK: ${{ inputs.track }}
        run: |
          {
            echo "## 🎉 Release ready"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | **v${VN}** (code ${VC}) |"
            echo "| Branch  | \`${BRANCH}\` |"
            echo "| Artifact| \`${AAB}\` |"
            echo "| Play track | \`${TRACK:-none}\` |"
            echo ""
            echo "### الخطوات التالية"
            echo "1. حمّل الـ AAB من قسم **Artifacts** بالأعلى."
            echo "2. ارفعه يدوياً إلى **Google Play Console → Internal testing → Create release**."
            echo "3. (أو فعّل الرفع التلقائي بإضافة secret \`GOOGLE_PLAY_SERVICE_ACCOUNT_JSON\`)."
          } >> $GITHUB_STEP_SUMMARY

# ==============================================================================
# 🔐  Secrets المطلوبة
# ==============================================================================
#
# إجبارية (نفس Secrets الموجودة في android-build.yml):
#   - ANDROID_KEYSTORE_BASE64
#   - ANDROID_KEYSTORE_PASSWORD
#   - ANDROID_KEY_ALIAS
#   - ANDROID_KEY_PASSWORD
#
# اختيارية (للرفع التلقائي إلى Google Play):
#   - GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
#       1. في Google Cloud Console: أنشئ Service Account وفعّل Google Play Android Developer API
#       2. حمّل ملف JSON وألصق محتواه كاملاً في هذا الـ secret
#       3. في Play Console → Setup → API access: امنح الـ service account صلاحيات
#          "Release manager" على التطبيق
# ==============================================================================
