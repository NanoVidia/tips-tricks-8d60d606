name: Release Android AAB

# ==============================================================================
# Workflow للإصدارات الرسمية مع تسمية الملف برقم الإصدار + الفرع.
# اختياري: إنشاء GitHub Release و/أو رفع تلقائي إلى Google Play.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "رقم الإصدار العام (إلزامي، مثال: 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "رقم البناء الداخلي (إلزامي، عدد صحيح متزايد، يبدأ من 1)"
        required: true
        default: "1"
      commit_version_bump:
        description: "حفظ تحديث الإصدار في المستودع تلقائياً"
        required: false
        default: true
        type: boolean
      track:
        description: "مسار النشر على Google Play"
        required: true
        default: "none"
        type: choice
        options: [none, internal, alpha, beta, production]
      create_github_release:
        description: "إنشاء GitHub Release مع AAB"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔢 Apply version inputs (capacitor.config.ts + appVersion.ts)
        env:
          IN_VN: ${{ inputs.version_name }}
          IN_VC: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [ -n "${IN_VN}" ]; then
            sed -i -E "s/(APP_VERSION_NAME = )\"[^\"]+\"/\1\"${IN_VN}\"/" capacitor.config.ts
            sed -i -E "s/(APP_VERSION_NAME = )\"[^\"]+\"/\1\"${IN_VN}\"/" src/lib/appVersion.ts
          fi
          if [ -n "${IN_VC}" ]; then
            [[ "${IN_VC}" =~ ^[0-9]+$ ]] || { echo "::error::version_code must be integer"; exit 1; }
            sed -i -E "s/(APP_VERSION_CODE = )[0-9]+/\1${IN_VC}/" capacitor.config.ts
            sed -i -E "s/(APP_VERSION_CODE = )[0-9]+/\1${IN_VC}/" src/lib/appVersion.ts
          fi

      - name: 💾 Commit version bump
        if: ${{ (inputs.version_name != '' || inputs.version_code != '') && inputs.commit_version_bump }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capacitor.config.ts src/lib/appVersion.ts
          if ! git diff --cached --quiet; then
            VN=$(grep -oE 'APP_VERSION_NAME = "[^"]+"' capacitor.config.ts | sed -E 's/.*"([^"]+)".*/\1/')
            VC=$(grep -oE 'APP_VERSION_CODE = [0-9]+' capacitor.config.ts | grep -oE '[0-9]+')
            git commit -m "chore(release): bump to v${VN} (build ${VC}) [skip ci]"
            git push
          fi

      - name: 🏷️ Extract version & branch metadata
        id: meta
        run: |
          VERSION_NAME=$(grep -oE 'APP_VERSION_NAME = "[^"]+"' capacitor.config.ts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -oE 'APP_VERSION_CODE = [0-9]+' capacitor.config.ts | grep -oE '[0-9]+')
          BRANCH="${GITHUB_REF_NAME}"
          BRANCH_SAFE=$(echo "$BRANCH" | tr '/' '-' | tr -cd '[:alnum:]._-')
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y%m%d-%H%M')
          ARTIFACT_NAME="tipstricks-v${VERSION_NAME}-vc${VERSION_CODE}-${BRANCH_SAFE}-${SHORT_SHA}"
          AAB_FILENAME="${ARTIFACT_NAME}.aab"
          TAG_NAME="v${VERSION_NAME}+${VERSION_CODE}"
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "branch=$BRANCH"
            echo "branch_safe=$BRANCH_SAFE"
            echo "short_sha=$SHORT_SHA"
            echo "build_date=$BUILD_DATE"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "aab_filename=$AAB_FILENAME"
            echo "tag_name=$TAG_NAME"
          } >> $GITHUB_OUTPUT
          echo "── Release metadata ──"
          echo "  version : v$VERSION_NAME ($VERSION_CODE)"
          echo "  branch  : $BRANCH"
          echo "  artifact: $AAB_FILENAME"

      - name: 🔎 Detect Play upload availability
        id: play
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: "35.0.0"
          cmdline-tools-version: "11076708"

      - name: 📦 Install npm dependencies
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning::npm ci failed — falling back to npm install"
            npm install --no-audit --no-fund
          }

      - name: 🏗️ Build web app (production)
        env:
          CAP_ENV: production
          NODE_ENV: production
        run: npm run build

      - name: 📱 Add Android platform & sync Capacitor
        env:
          CAP_ENV: production
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🎨 Generate Android icons & splash
        run: |
          if [ -f "resources/icon.png" ] && [ -f "resources/splash.png" ]; then
            npx --yes @capacitor/assets generate --android || true
          fi

      - name: 🔢 Patch versionCode / versionName
        env:
          VN: ${{ steps.meta.outputs.version_name }}
          VC: ${{ steps.meta.outputs.version_code }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VN\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: 🔐 Ensure required Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          add_perm() {
            local p="$1"
            if ! grep -q "$p" "$MANIFEST"; then
              sed -i "s|<application|<uses-permission android:name=\"$p\" />\n    <application|" "$MANIFEST"
            fi
          }
          add_perm "android.permission.INTERNET"
          add_perm "android.permission.POST_NOTIFICATIONS"
          add_perm "com.android.vending.BILLING"

      - name: 🔐 Verify required Android secrets exist
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -uo pipefail

          declare -A SECRET_HINT=(
            [ANDROID_KEYSTORE_BASE64]="ملف release.keystore بعد تحويله إلى Base64 (سطر واحد بدون مسافات)."
            [ANDROID_KEYSTORE_PASSWORD]="كلمة مرور الـ keystore (storepass) المُستخدمة عند توليده."
            [ANDROID_KEY_ALIAS]="اسم الـ alias داخل الـ keystore (مثال: tipstricks)."
            [ANDROID_KEY_PASSWORD]="كلمة مرور المفتاح (keypass). غالباً نفس كلمة الـ keystore."
          )

          missing=()
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            val="${!s}"
            [ -z "$val" ] && missing+=("$s")
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            B64_LEN=${#ANDROID_KEYSTORE_BASE64}
            if [ "$B64_LEN" -lt 1400 ]; then
              echo "::warning::ANDROID_KEYSTORE_BASE64 length is suspiciously small ($B64_LEN chars)."
            fi
            echo "✓ All four Android signing secrets are present (base64 length: $B64_LEN chars)"
            exit 0
          fi

          echo "::error::Missing ${#missing[@]} required Android signing secret(s): ${missing[*]}"
          {
            echo "## ❌ Android signing secrets missing"
            echo ""
            echo "### Missing secrets"
            echo "| Secret | What it is |"
            echo "|---|---|"
            for s in "${missing[@]}"; do
              echo "| \`$s\` | ${SECRET_HINT[$s]} |"
            done
            echo ""
            echo "### How to restore"
            echo "- **Recommended (app already on Play):** [Import Existing Android Keystore](${REPO_URL}/actions/workflows/import-keystore.yml)"
            echo "- **First-time only:** [Setup Android Signing Secrets (one-time)](${REPO_URL}/actions/workflows/generate-keystore.yml)"
            echo "- **Manual:** [Repository Secrets settings](${REPO_URL}/settings/secrets/actions)"
            echo ""
            echo "> ⚠️ Google Play rejects any AAB signed with a different keystore than the original. Use Import (not Generate) if the app is already published."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 🔑 Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          SIZE=$(stat -c%s android/app/release.keystore)
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Decoded keystore too small ($SIZE bytes) — secret likely corrupt"
            exit 1
          fi

      - name: ✅ Validate keystore credentials
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore android/app/release.keystore -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore password or alias is wrong"
            exit 1
          fi

      - name: 🔎 Print keystore entries (no secrets)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "── Keystore entries ──"
          keytool -list -keystore android/app/release.keystore -storepass "$KS_PASS" -v 2>/dev/null | grep -E "Alias|Entry type|Creation date" || \
          keytool -list -keystore android/app/release.keystore -storepass "$KS_PASS" 2>/dev/null
          echo "── Make sure ANDROID_KEY_ALIAS matches one of the aliases above ──"

      - name: ✍️ Inject signing config
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if grep -q "signingConfigs" "$GRADLE_FILE"; then
            echo "signingConfigs already present"
          else
            cat > /tmp/inject_signing.py <<'PY'
          import re
          path = "android/app/build.gradle"
          content = open(path).read()
          signing_block = (
              '    signingConfigs {\n'
              '        release {\n'
              '            storeFile file("release.keystore")\n'
              '            storePassword System.getenv("KS_PASS")\n'
              '            keyAlias System.getenv("KEY_ALIAS")\n'
              '            keyPassword System.getenv("KEY_PASS")\n'
              '        }\n'
              '    }\n'
          )
          new, n = re.subn(r'(android\s*\{\r?\n)', r'\1' + signing_block, content, count=1)
          if n == 0:
              raise SystemExit("Could not find 'android {' block")
          content = new
          new, n = re.subn(
              r'(buildTypes\s*\{\s*\r?\n\s*release\s*\{\s*\r?\n)',
              r'\1            signingConfig signingConfigs.release\n',
              content, count=1,
          )
          if n == 0:
              new = re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.release', content, count=1)
          open(path, "w").write(new)
          print("signingConfigs injected")
          PY
            python3 /tmp/inject_signing.py
          fi

      - name: 📦 Build signed AAB
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 🏷️ Rename AAB
        id: rename
        env:
          AAB_FILENAME: ${{ steps.meta.outputs.aab_filename }}
        run: |
          SRC="android/app/build/outputs/bundle/release/app-release.aab"
          mkdir -p release-output
          DEST="release-output/${AAB_FILENAME}"
          cp "$SRC" "$DEST"
          echo "aab_path=$DEST" >> $GITHUB_OUTPUT
          ls -la release-output/

      - name: 🔍 Verify AAB is signed
        env:
          AAB: ${{ steps.rename.outputs.aab_path }}
        run: |
          SIZE=$(stat -c%s "$AAB")
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::AAB suspiciously small ($SIZE bytes)"
            exit 1
          fi
          if ! unzip -l "$AAB" | grep -E "META-INF/.*\.(RSA|EC|DSA)" ; then
            echo "::error::AAB is NOT signed"
            exit 1
          fi
          if ! jarsigner -verify -strict "$AAB" > /tmp/jarsigner.log 2>&1 ; then
            echo "::error::jarsigner verification failed"
            cat /tmp/jarsigner.log
            exit 1
          fi
          echo "── Certificate fingerprint ──"
          keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -E "SHA(1|256):" || true
          echo "✅ AAB signed & verified ($SIZE bytes)"

      - name: 📤 Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.rename.outputs.aab_path }}
          retention-days: 90
          if-no-files-found: error

      - name: 📝 Generate release notes
        env:
          VN: ${{ steps.meta.outputs.version_name }}
          VC: ${{ steps.meta.outputs.version_code }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          SHA: ${{ steps.meta.outputs.short_sha }}
          DATE: ${{ steps.meta.outputs.build_date }}
        run: |
          {
            echo "### Tips & Tricks — v${VN} (build ${VC})"
            echo ""
            echo "- **Branch:** \`${BRANCH}\`"
            echo "- **Commit:** \`${SHA}\`"
            echo "- **Built:** ${DATE} UTC"
            echo ""
            echo "#### Recent changes"
            git log -10 --pretty="- %s (%h)" || true
          } > release-notes.md

      - name: 🚀 Create GitHub Release
        if: ${{ github.event_name == 'push' || inputs.create_github_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "v${{ steps.meta.outputs.version_name }} (build ${{ steps.meta.outputs.version_code }})"
          body_path: release-notes.md
          files: ${{ steps.rename.outputs.aab_path }}
          draft: false
          prerelease: false

      - name: ☁️ Publish to Google Play
        if: ${{ inputs.track != 'none' && inputs.track != '' && steps.play.outputs.available == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.lovable.tipstricks
          releaseFiles: ${{ steps.rename.outputs.aab_path }}
          track: ${{ inputs.track }}
          status: draft

      - name: ⚠️ Play upload skipped notice
        if: ${{ inputs.track != 'none' && inputs.track != '' && steps.play.outputs.available != 'true' }}
        run: |
          echo "::warning::Skipped Play upload — secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON not set."

      - name: ✅ Summary
        env:
          VN: ${{ steps.meta.outputs.version_name }}
          VC: ${{ steps.meta.outputs.version_code }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          AAB: ${{ steps.meta.outputs.aab_filename }}
          ARTIFACT_NAME: ${{ steps.meta.outputs.artifact_name }}
          TAG: ${{ steps.meta.outputs.tag_name }}
          TRACK: ${{ inputs.track }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          ARTIFACT_URL="${REPO_URL}/actions/runs/${GITHUB_RUN_ID}#artifacts"
          RELEASE_URL="${REPO_URL}/releases/tag/${TAG}"
          LATEST_URL="${REPO_URL}/releases/latest"
          {
            echo "## 🎉 Release ready — v${VN} (build ${VC})"
            echo ""
            echo "### 📥 تنزيل ملف AAB"
            echo ""
            echo "| الطريقة | الرابط |"
            echo "|---|---|"
            echo "| ⬇️ **Artifact (هذا الـ run)** | [\`${ARTIFACT_NAME}.aab\`](${ARTIFACT_URL}) |"
            echo "| 🏷️ **GitHub Release (رابط ثابت)** | [${TAG}](${RELEASE_URL}) |"
            echo "| 🆕 **آخر إصدار دائماً** | [Latest Release](${LATEST_URL}) |"
            echo ""
            echo "> الـ Artifact يبقى 90 يوماً. الـ Release رابط دائم."
            echo ""
            echo "### 📋 معلومات البناء"
            echo "| | |"
            echo "|---|---|"
            echo "| Version    | **v${VN}** (code ${VC}) |"
            echo "| Branch     | \`${BRANCH}\` |"
            echo "| Artifact   | \`${AAB}\` |"
            echo "| Play track | \`${TRACK:-none}\` |"
            echo ""
            echo "### 🚀 الخطوة التالية"
            echo "نزّل الـ AAB ثم ارفعه إلى [Google Play Console](https://play.google.com/console) → التطبيق → **Production / Internal testing** → **Create new release**."
          } >> $GITHUB_STEP_SUMMARY

# ==============================================================================
# 🔐 Required Secrets:
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Optional (Play auto-upload):
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
# ==============================================================================
