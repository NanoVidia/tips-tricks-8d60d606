version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      radix-ui:
        patterns: ["@radix-ui/*"]
      capacitor:
        patterns: ["@capacitor/*"]
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["ci", "automated"]
    commit-message:
      prefix: "chore(ci)"
