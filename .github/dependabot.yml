version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 1
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      radix-ui:
        patterns: ["@radix-ui/*"]
      capacitor:
        patterns: ["@capacitor/*"]
      dev-dependencies:
        dependency-type: "development"
